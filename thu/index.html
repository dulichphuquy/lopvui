<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B1828">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lớp Vui</title>
<!-- BẢN THỬ -->
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Bộ trò chơi lớp học tiếng Việt, chạy được khi mất mạng.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<style>
:root{color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: thanh trên cùng + một khung nội dung; trang chính là lưới thẻ trò chơi, màn chơi chiếm toàn bộ khung (hợp máy chiếu), ngăn "Tùy chỉnh" trượt từ phải */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#E9EDF1; --fg:#14202B; --muted:#5B6874; --line:#D5DCE3;
  --accent:#0E7490; --accent-fg:#FFFFFF; --good:#15803D; --bad:#B42318; --gold:#E9A800;
  --a1:#D63B3B; --a2:#2563EB; --a3:#D69E00; --a4:#16884A;
  --f-display:"Lexend","Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F161C; --surface:#172129; --surface-2:#1F2B35; --fg:#E7EDF2; --muted:#93A1AD; --line:#2C3A46; --good:#22A055; --bad:#E5534B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#172129; --surface-2:#1F2B35; --fg:#E7EDF2; --muted:#93A1AD; --line:#2C3A46; --good:#22A055; --bad:#E5534B; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}

.app{display:flex;flex-direction:column;height:100%}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand i{width:24px;height:24px;border-radius:7px;background:conic-gradient(var(--a1) 0 25%,var(--a2) 0 50%,var(--a3) 0 75%,var(--a4) 0);transform:rotate(45deg) scale(.8)}
.subjects{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.subj{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
.subj[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tools{display:flex;gap:6px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.iconbtn:hover{background:var(--surface-2)}
.view{flex:1;min-height:0;overflow:auto}
.wrap{max-width:1180px;margin:0 auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}

/* Nút, ô nhập */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:12px 22px;font-size:17px;border-radius:12px}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
select,input[type=text],input[type=number],textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
input[type=range]{accent-color:var(--accent);width:100%}
textarea{resize:vertical;min-height:150px;line-height:1.55;font-size:14px}
textarea.code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:14px;tab-size:2}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;padding:7px 8px;font-size:13px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.switch input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--bg)}
.chip.absent{text-decoration:line-through;color:var(--muted);border-style:dashed}
.chip.out{background:var(--surface-2);color:var(--muted)}
.chip.out::after{content:" ✓";color:var(--accent);font-weight:700}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--bad) 10%,transparent);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn .kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.75}
.kbd{font-family:var(--f-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--surface);font-size:12px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;z-index:60;max-width:calc(100% - 32px)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}

/* Trang chính */
.prep{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.prep .panel{flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap}
.prep .badge{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-family:var(--f-display);font-weight:700;font-size:18px;flex:none}
.prep .grow{flex:1;min-width:160px;display:flex;flex-direction:column;gap:4px}
.prep select{font-weight:600}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.gcard:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.12)}
.gcard .art{height:132px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-bottom:1px solid var(--line)}
.gcard .art svg{height:96px;width:auto}
.gcard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.gcard h3{font-size:18px}
.gcard p{margin:0;color:var(--muted);font-size:14px}
.gcard .needs{font-size:12px;font-weight:600;margin-top:4px}
.gcard .needs.ok{color:var(--good)}
.gcard .needs.no{color:var(--bad)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.section-title h2{font-size:22px}

/* Trang quản lý (lớp, bộ câu hỏi) */
.manage{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.list{display:flex;flex-direction:column;gap:4px}
.list button{text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 10px;font-weight:600;display:flex;flex-direction:column}
.list button small{font-weight:400;color:var(--muted);font-size:12px}
.list button[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.preview{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto}
.pitem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);font-size:14px}
.pitem .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.pitem ol{margin:4px 0 0;padding-left:20px}
.pitem li.ok{color:var(--good);font-weight:600}
.perr{border-color:color-mix(in srgb,var(--bad) 50%,var(--line));color:var(--bad)}
details.help summary{cursor:pointer;font-weight:600}
details.help pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;font-size:13px;margin:8px 0 0}

/* Màn chơi */
.gameview{display:flex;flex-direction:column;height:100%}
.gamebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.gamebar .title{font-family:var(--f-display);font-weight:600;font-size:17px}
.gamebar .ctx{color:var(--muted);font-size:13px}
.gamebar .sp{flex:1}
.gamebody{flex:1;min-height:0;display:flex;position:relative}
.stage{flex:1;min-width:0;position:relative;overflow:auto;background-color:var(--bg);background-image:var(--pattern);display:flex;flex-direction:column}
.drawer{width:330px;flex:none;border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.drawer h3{font-size:16px}
.drawer details summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.drawer details[open] summary{margin-bottom:12px}
.drawer .adv{display:flex;flex-direction:column;gap:16px}
.present .topbar,.present .gamebar,.present .drawer{display:none}
.exitp{display:none}
.present .exitp{display:inline-flex;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:40;opacity:.55}
.present .exitp:hover{opacity:1}

/* Hộp kết quả dùng chung */
.overlay{position:fixed;inset:0;background:rgba(8,14,20,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.result{position:relative;background:var(--surface);border-radius:22px;padding:30px 28px 22px;width:min(680px,100%);text-align:center;display:flex;flex-direction:column;gap:16px;
  box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 35%,transparent),0 30px 80px rgba(0,0,0,.4);border-top:8px solid var(--accent);
  animation:pop .5s cubic-bezier(.2,1.5,.4,1);overflow:hidden;max-height:calc(100% - 20px);overflow-y:auto}
@keyframes pop{0%{transform:scale(.6) rotate(-3deg);opacity:0}100%{transform:none;opacity:1}}
.result::before{content:"";position:absolute;inset:-40% -40% auto;height:520px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0 90px,transparent 230px);mask-image:radial-gradient(circle at 50% 50%,#000 0 90px,transparent 230px);background:conic-gradient(from 0deg,transparent 0 20deg,color-mix(in srgb,var(--gold) 22%,transparent) 20deg 30deg,transparent 30deg 60deg);
  animation:rays 14s linear infinite;pointer-events:none;z-index:0;opacity:.8}
.result>*{position:relative;z-index:1}
@keyframes rays{to{transform:rotate(360deg)}}
.result.yen::before{display:none}  /* khung hỏi/thông báo: không có tia sáng sau chữ */
.who-label{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.who{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,7vw,70px);line-height:1.1;text-wrap:balance}
.who span{display:inline-block;animation:letter .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes letter{from{transform:translateY(40%) scale(.4);opacity:0}to{transform:none;opacity:1}}
.congrats{font-size:15px;color:var(--muted);font-weight:500;margin-top:-8px}
.qbox{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:clamp(17px,2.4vw,22px);text-align:left}
.minirow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center;font-size:13px}
.minirow .lbl{color:var(--muted);font-weight:600;margin-right:2px}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.pill[aria-pressed="true"].ok{background:var(--good);border-color:var(--good);color:#fff}
.pill[aria-pressed="true"].no{background:var(--bad);border-color:var(--bad);color:#fff}
.pill[aria-pressed="true"].abs,.pill[aria-pressed="true"].t{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.timer{font-family:var(--f-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;min-width:56px;padding:0 10px;border-radius:10px}
.timer.warn{color:var(--bad);animation:blink .5s steps(2) infinite}
.timer.done{background:var(--bad);color:#fff}
@keyframes blink{50%{opacity:.4}}
.actions3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px}
.actions3 .btn{padding:12px 10px;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.25}
.actions3 .btn small{font-size:12px;font-weight:500;opacity:.8}
.btn.remove{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.keep{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}

/* Vòng quay */
.wheel-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px 24px 16px 16px}
.stage-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;text-align:center}
.stage-head .nm{font-family:var(--f-display);font-weight:600;font-size:22px}
.stats{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.wheel-wrap{position:relative;width:min(70vh,100%);max-width:820px;aspect-ratio:1;flex:none}
.wheel-wrap canvas{width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.pointer{position:absolute;right:-8px;top:50%;transform:translateY(-50%) rotate(90deg);width:34px;height:42px;filter:drop-shadow(-3px 0 4px rgba(0,0,0,.25));pointer-events:none;transform-origin:50% 50%}
.pointer.bump{animation:bump .09s ease-out}
@keyframes bump{50%{transform:translateY(-50%) rotate(76deg)}}
.hint{color:var(--muted);font-size:13px;text-align:center}

/* Chia nhóm */
.groups-stage{padding:18px 16px 28px;display:flex;flex-direction:column;gap:16px}
.groups-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.present .ggrid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.group.drop{outline:3px dashed var(--accent);outline-offset:-3px}
.group header{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff}
.group header .gname{font-family:var(--f-display);font-weight:700;font-size:17px;flex:1;min-width:0;outline:none;border-radius:6px;padding:0 4px}
.group header .gname:focus{background:rgba(255,255,255,.2)}
.group header .cnt{font-size:12px;font-weight:600;opacity:.9}
.group ul{list-style:none;margin:0;padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;min-height:44px}
.group li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:var(--bg);font-weight:500;cursor:grab;animation:drop .35s cubic-bezier(.2,1.4,.4,1) both;font-size:clamp(14px,1.3vw,18px)}
.group li.sel{outline:2px solid var(--accent)}
.group li .role{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);white-space:nowrap}
@keyframes drop{from{transform:translateY(-14px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.group footer{display:flex;align-items:center;gap:6px;justify-content:space-between;padding:6px 10px 10px;border-top:1px solid var(--line)}
.score{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.sbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:16px}
.empty{margin:auto;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center;padding:40px 16px;max-width:520px}
.empty h2{color:var(--fg);font-size:24px}

/* Đố vui */
.quiz{flex:1;display:flex;flex-direction:column;gap:16px;padding:18px max(16px,3vw) 22px;min-height:0}
.qhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qhead .prog{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.tbar{flex:1;height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;min-width:120px}
.tbar i{display:block;height:100%;background:var(--accent);transform-origin:left;transition:background .3s}
.tbar.warn i{background:var(--bad)}
.tnum{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.qmain{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;flex:1 0 auto;align-content:start}
.qmain.withteams{grid-template-columns:minmax(0,1fr) 300px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,36px);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.4vw,44px);line-height:1.3;text-wrap:balance;min-height:150px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:14px;border:0;border-radius:16px;padding:16px 18px;color:#fff;font-weight:600;font-size:clamp(17px,2.2vw,28px);text-align:left;min-height:84px;transition:transform .15s,opacity .3s,filter .3s;position:relative}
.opt:hover{transform:translateY(-2px)}
.opt .shape{width:38px;height:38px;flex:none;display:grid;place-items:center}
.opt .key{position:absolute;right:12px;top:8px;font-size:12px;opacity:.75;font-weight:700}
.opt.o0{background:var(--a1)}.opt.o1{background:var(--a2)}.opt.o2{background:var(--a3)}.opt.o3{background:var(--a4)}
.opt.chosen{box-shadow:0 0 0 5px var(--fg)}
.revealed .opt{opacity:.28;filter:grayscale(.6)}
.revealed .opt.right{opacity:1;filter:none;box-shadow:0 0 0 5px var(--gold),0 0 30px var(--gold);transform:scale(1.02)}
.revealed .opt.right::after{content:"✓";position:absolute;right:16px;font-size:34px}
.ansbox{background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;font-size:clamp(20px,2.6vw,32px);font-weight:700;font-family:var(--f-display)}
.ansbox.show{border-style:solid;border-color:var(--good);color:var(--good)}
.explain{background:color-mix(in srgb,var(--good) 10%,var(--surface));border-radius:12px;padding:10px 14px;font-size:16px}
.qfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.teams{display:flex;flex-direction:column;gap:8px}
.team{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.team .dot{width:14px;height:14px;border-radius:4px;flex:none}
.team .nm{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.team .pts{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:20px}
.team button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:2px 8px;font-weight:700}
.team.hit{animation:hit .5s}
@keyframes hit{40%{transform:scale(1.05);background:color-mix(in srgb,var(--good) 20%,var(--surface))}}
.team.turn{box-shadow:0 0 0 3px var(--accent)}
.team{flex-wrap:wrap}
.team .repline{flex-basis:100%;display:flex;align-items:center;gap:8px;padding-left:24px;min-height:30px}
.team .rep{flex:1;min-width:0;font-family:var(--f-display);font-size:clamp(16px,1.5vw,20px);color:var(--accent);overflow-wrap:anywhere;line-height:1.2}
.team .rep.rolling{color:var(--muted)}
.team .rep.empty{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted)}
.team .repline button.call{font-size:12px;padding:3px 10px;font-weight:600;white-space:nowrap}
.team.called{animation:hit .6s;box-shadow:0 0 0 3px var(--gold)}
.callall{width:100%}
.group li.rolling{background:color-mix(in srgb,var(--accent) 22%,var(--bg))}
.group li.called{outline:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--bg));font-weight:700;animation:matched .6s}
.group li.called::after{content:"Được gọi";margin-left:auto;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--gold);color:#1b1b1b;white-space:nowrap}
.group li.called .role{margin-left:8px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin-top:10px}
.podium div{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(180px,28vw)}
.podium .bar{transform-origin:bottom;width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:10px;color:#fff;font-family:var(--f-display);font-weight:700;font-size:28px;animation:rise .8s cubic-bezier(.2,1.2,.4,1) both}
.podium .pn{font-family:var(--f-display);font-weight:700;font-size:clamp(16px,2vw,22px);text-align:center}
@keyframes rise{from{transform:scaleY(0)}to{transform:none}}
.intro{margin:auto;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;max-width:640px;padding:30px 16px}
.intro h2{font-size:clamp(28px,4vw,46px)}

/* Lật thẻ */
.flip-stage{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px;align-items:center}
.flip-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;font-weight:600}
.flip-top .stat{font-variant-numeric:tabular-nums;color:var(--muted)}
.flip-top .stat b{color:var(--fg);font-family:var(--f-display);font-size:20px}
.board{display:grid;gap:12px;width:100%;max-width:1100px}
.card{perspective:900px;aspect-ratio:4/3;border:0;background:none;padding:0;min-width:0}
.card .in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:grid;place-items:center;padding:8px;text-align:center;overflow:hidden}
.card .b{background:var(--accent);color:var(--accent-fg);font-family:var(--f-display);font-weight:700;font-size:clamp(20px,3vw,34px);background-image:var(--pattern);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.card .f{transform:rotateY(180deg);background:var(--surface);border:2px solid var(--line);font-weight:600;font-size:clamp(13px,1.6vw,22px);line-height:1.25;overflow-wrap:anywhere}
.card.done .f{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.card.done{animation:matched .6s}
.card.bad .in{animation:shake .4s}
@keyframes matched{40%{transform:scale(1.08)}}
@keyframes shake{25%{transform:rotateY(180deg) translateX(-8px)}75%{transform:rotateY(180deg) translateX(8px)}}
.fc{width:min(720px,100%);aspect-ratio:16/10;perspective:1400px;border:0;background:none;padding:0}
.fc .in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.2,.5,1);transform-style:preserve-3d}
.fc.up .in{transform:rotateX(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;padding:28px;text-align:center;font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.6vw,44px);line-height:1.25;background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.12)}
.fc .b{transform:rotateX(180deg);border-top:8px solid var(--accent)}
.fc small{font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

@media (max-width:900px){
  .subjects{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .subj{flex:none}
  .prep,.editor,.manage{grid-template-columns:1fr}
  .drawer{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:-10px 0 30px rgba(0,0,0,.2);width:min(330px,90%)}
  .qmain.withteams{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
}
@media (max-width:520px){.actions3{grid-template-columns:1fr 1fr}.actions3 .primary{grid-column:1/-1}}
.lessfx *,.lessfx *::before{animation:none!important;transition:none!important}

/* ===== Đố vui: bố cục dọc gọn (câu hỏi → đáp án → gọi tên → dải các đội) ===== */
.quiz{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px max(16px,2.5vw) 16px}
.qhead .tries{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.qhead .tries .lbl{margin-right:3px}
.qhead .tries i{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent)}
.qhead .tries i.on{background:var(--accent)}
.tbar.paused i{background:var(--muted)}
.qcard{min-height:0;padding:clamp(14px,2.4vh,30px) clamp(16px,3vw,36px);font-size:clamp(20px,min(3.2vw,5.4vh),44px)}
.opt{min-height:clamp(52px,9vh,84px);padding:10px 16px;font-size:clamp(16px,min(2.1vw,3.6vh),28px)}
.opt.right{opacity:1;filter:none;box-shadow:0 0 0 5px var(--gold),0 0 30px var(--gold);transform:scale(1.02)}
.opt.right::after{content:"✓";position:absolute;right:16px;font-size:34px}
.opt.wrong{opacity:.35;filter:grayscale(.7);animation:shake2 .4s}
.opt.wrong::after{content:"✕";position:absolute;right:18px;font-size:28px}
.opt.gone{opacity:.08;pointer-events:none;filter:grayscale(1)}
.locked .opt{cursor:default}
.locked .opt:hover{transform:none}
.locked .opt.right:hover{transform:scale(1.02)}
@keyframes shake2{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shortrow{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.shortrow .ansbox{flex:1;min-width:220px}
.judge{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qctl .sp{flex:1}
.callout{font-family:var(--f-display);font-weight:700;font-size:clamp(16px,1.6vw,22px);color:var(--muted)}
.callout.on{color:var(--accent)}
.msg{font-size:13px;color:var(--muted);flex:1;min-width:0}
.tstrip{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.tstrip-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tchip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0;transition:box-shadow .2s,background .2s,border-color .2s}
.tchip:hover{border-color:var(--tc)}
.tchip.answering{border-color:var(--tc);box-shadow:0 0 0 2px var(--tc);background:color-mix(in srgb,var(--tc) 12%,var(--surface))}
.tchip .t1,.tchip .t2{display:flex;align-items:center;gap:8px;min-width:0}
.tchip .dot{width:12px;height:12px;border-radius:4px;background:var(--tc);flex:none}
.tchip .tname{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tchip .tscore{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.tchip .trep{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
.tchip .trep.on{color:var(--fg);font-family:var(--f-display);font-weight:700;font-size:15px}
.tchip .trep.rolling{color:var(--muted);font-weight:600}
.tchip .t2 button{border:1px solid var(--line);background:var(--bg);border-radius:8px;height:28px;min-width:28px;padding:0 8px;font-weight:700;font-size:13px;flex:none}
.tchip .t2 button:hover{background:var(--surface-2)}
.tchip .badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--tc);color:#fff;white-space:nowrap;flex:none}
.tchip.hit{animation:hit .5s}
.tchip.called{animation:matched .6s}
.quiz.shake{animation:shake2 .4s}
.qbanner{position:fixed;left:50%;top:40%;z-index:35;transform:translate(-50%,-50%);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 34px;border-radius:22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:ban 1.8s ease both;max-width:calc(100% - 32px)}
.qbanner b{font-family:var(--f-display);font-size:clamp(30px,5vw,60px);line-height:1.1}
.qbanner span{font-weight:600;font-size:clamp(15px,1.6vw,20px)}
.qbanner.good{background:var(--good);color:#fff}
.qbanner.soft{background:var(--surface);color:var(--fg);border:3px solid var(--gold)}
.qbanner.bad{background:var(--bad);color:#fff}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.96)}}
@media (max-height:720px){.quiz{gap:8px;padding-top:10px;padding-bottom:10px}.tchip{padding:6px 10px;gap:4px}.tchip .tscore{font-size:22px}.qctl .btn.big{padding:9px 18px;font-size:16px}}

/* ===== Hình, công thức, soạn câu hỏi ===== */
math{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",serif;font-size:1.08em}
.qimg{max-width:100%;max-height:min(40vh,420px);height:auto;vertical-align:middle;border-radius:8px;background:#fff;cursor:zoom-in;margin:4px 0}
.pitem .qimg{max-height:160px}
.imgmiss{font-size:.8em;color:var(--bad);font-weight:600}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(5,10,15,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;cursor:zoom-out}
.lightbox img{max-width:96vw;max-height:88vh;background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lightbox .note{color:#cfd8df}
.toolbar{gap:6px}
.report{border-radius:12px;padding:10px 14px;font-size:14px;background:var(--surface-2)}
.report.ok{background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.report.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
.rwarn{margin-top:6px;color:#9a6200;font-weight:500}
.pwarn{border-color:color-mix(in srgb,var(--gold) 60%,var(--line));background:color-mix(in srgb,var(--gold) 12%,var(--bg))}
.pitem{cursor:pointer}
.pitem.passage{background:color-mix(in srgb,var(--accent) 8%,var(--bg));border-style:dashed}
.pitem.incl{margin-left:14px;border-left:3px solid color-mix(in srgb,var(--accent) 50%,var(--line))}
.pitem .k{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pitem .expl{margin-top:6px}
.pitem b.tt,.pitem b.ff{display:inline-block;width:20px;text-align:center;border-radius:5px;color:#fff;font-size:12px;margin-right:4px}
.pitem b.tt{background:var(--good)}.pitem b.ff{background:var(--bad)}
.lvl{font-size:11px;font-weight:700;letter-spacing:.03em;padding:1px 8px;border-radius:999px;text-transform:none;white-space:nowrap}
.lvl-NB{background:#DCFCE7;color:#166534}.lvl-TH{background:#DBEAFE;color:#1E40AF}.lvl-VD{background:#FEF3C7;color:#92400E}.lvl-VDC{background:#FCE7F3;color:#9D174D}

/* ===== Đố vui: cỡ chữ tối thiểu, câu chùm, đọc đề, đúng/sai 4 ý ===== */
.quiz .qcard{font-size:var(--fq,clamp(20px,min(3.2vw,5.4vh),44px))}
.quiz .opt{font-size:var(--fo,clamp(16px,min(2.1vw,3.6vh),28px));min-height:calc(var(--fo,24px) * 2.3);line-height:1.25}
.quiz .ansbox{font-size:var(--fo,24px)}
.quiz .explain{font-size:max(16px,calc(var(--fo,24px) * .72));line-height:1.4}
.opts.one{grid-template-columns:1fr}
.opt .otxt{min-width:0;overflow-wrap:anywhere}
.opt.hasimg{background:var(--surface);color:var(--fg);border:3px solid var(--line)}
.opt.hasimg.o0{border-color:var(--a1)}.opt.hasimg.o1{border-color:var(--a2)}.opt.hasimg.o2{border-color:var(--a3)}.opt.hasimg.o3{border-color:var(--a4)}
.opt.hasimg .shape svg path,.opt.hasimg .shape svg circle,.opt.hasimg .shape svg rect{fill:currentColor}
.opt.hasimg.o0 .shape{color:var(--a1)}.opt.hasimg.o1 .shape{color:var(--a2)}.opt.hasimg.o2 .shape{color:var(--a3)}.opt.hasimg.o3 .shape{color:var(--a4)}
.opt .qimg{max-height:min(16vh,150px);margin:0}
.qsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.qleft{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 18px;max-height:calc(100vh - 250px);overflow:auto;font-size:var(--fp,22px);line-height:1.38;display:flex;flex-direction:column;gap:10px}
.present .qleft{max-height:calc(100vh - 150px)}
.qleft .qimg{max-height:46vh;display:block;margin:4px auto}
.qleft .passage{overflow-wrap:anywhere}
.qright{display:flex;flex-direction:column;gap:12px;min-width:0}
.qcard.left{text-align:left;justify-content:flex-start}
.reading .answers,.reading #qHint{display:none}
.reading .qcard{min-height:30vh}
.tf4{display:flex;flex-direction:column;gap:8px}
.tfrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(64px,auto);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:var(--fo,22px);line-height:1.3;transition:background .3s,box-shadow .3s}
.tfrow .tlab{font-family:var(--f-display);font-weight:700;color:var(--accent)}
.tfrow .ttxt{min-width:0;overflow-wrap:anywhere}
.tfb{display:flex;gap:6px}
.tfb button{font-size:max(15px,calc(var(--fo,22px) * .62));padding:6px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-weight:700}
.tfb button[data-v="1"][aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.tfb button[data-v="0"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.tfb button:disabled{cursor:default}
.tres{font-family:var(--f-display);font-weight:800;text-align:center;font-size:max(15px,calc(var(--fo,22px) * .7))}
.tfrow.good{border-color:var(--good);box-shadow:0 0 0 2px var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface));animation:matched .5s}
.tfrow.good .tres{color:var(--good)}
.tfrow.good .tres::before{content:"✓ "}
.tfrow.bad{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface));animation:shake2 .4s}
.tfrow.bad .tres{color:#9a6200}
.tfrow.bad .tres::before{content:"Đáp án: ";font-size:.7em;font-weight:600}
.tfrow.shown{animation:matched .5s}
.tfrow.shown .tres{color:var(--accent)}
.qhead .lvl{font-size:13px}
@media (max-width:900px){.qsplit{grid-template-columns:1fr}.qleft{max-height:none}.tfrow{grid-template-columns:auto minmax(0,1fr)}.tfb,.tres{grid-column:2}}
.quiz>*,.qright>*,.qsplit>*{flex-shrink:0}
.qcard .qtext{max-width:100%;overflow-wrap:anywhere}
.qright .tfrow{grid-template-columns:auto minmax(0,1fr)}
.qright .tfb{grid-column:2}
.qright .tres{grid-column:2;text-align:left}
.qsplit:has(.tf4){grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr)}

/* ===== Cá heo linh vật ===== */
.mascot{display:inline-block;width:var(--mpx);height:calc(var(--mpx) * 1.05);flex:none;line-height:0}
.dolphin{width:100%;height:100%;overflow:visible}
.dolphin .dbody{transform-box:view-box;transform-origin:110px 200px;animation:dFloat 3.2s ease-in-out infinite}
.dolphin .fin{transform-box:view-box}
.dolphin .finR{transform-origin:139px 131px}
.dolphin .finL{transform-origin:90px 131px}
.dolphin .eye{transform-box:fill-box;transform-origin:center;animation:dBlink 5s infinite}
.dolphin .dx{transform-box:fill-box;transform-origin:center}
@keyframes dFloat{50%{transform:translateY(-5px) rotate(-1.5deg)}}
@keyframes dBlink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
.pose-hello .finR{animation:dWave 1.3s ease-in-out infinite}
.pose-hello .finR{transform:translate(14px,-6px) rotate(-60deg)}
@keyframes dWave{0%,100%{transform:translate(14px,-6px) rotate(-85deg)}50%{transform:translate(14px,-6px) rotate(-35deg)}}
.pose-cheer .dbody{animation:dJump .55s cubic-bezier(.3,1.5,.5,1) infinite alternate}
.pose-cheer .finR{transform:translate(14px,-8px) rotate(-80deg)}
.pose-cheer .finL{transform:translate(-30px,-12px) rotate(70deg)}
.pose-cheer .stars{animation:dTwinkle .9s ease-in-out infinite alternate}
@keyframes dJump{from{transform:translateY(0) scale(1,1)}to{transform:translateY(-14px) scale(1.02,.98)}}
@keyframes dTwinkle{from{transform:scale(.85);opacity:.7}to{transform:scale(1.12);opacity:1}}
.pose-think .dbody{animation:dTilt 2.6s ease-in-out infinite}
.pose-think .finR{transform:rotate(-58deg)}
.pose-think .brow{opacity:1}
.pose-think .qmark{animation:dBob 1.6s ease-in-out infinite}
@keyframes dTilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(-1deg)}}
@keyframes dBob{50%{transform:translateY(-5px)}}
.pose-encourage .finR{transform:translate(14px,-4px) rotate(-55deg)}
.pose-encourage .dbody{animation:dNod 1.4s ease-in-out infinite}
.pose-encourage .heart{animation:dTwinkle .8s ease-in-out infinite alternate}
@keyframes dNod{0%,100%{transform:rotate(0)}30%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}}
.hello{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hello .bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 18px;font-size:16px;max-width:620px;flex:1;min-width:220px}
.hello .bubble::before{content:"";position:absolute;left:-9px;top:28px;width:16px;height:16px;background:var(--surface);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.hello .bubble b{font-family:var(--f-display)}
.qhead .mascot.mini{margin:-8px 0 -6px -4px}
.qbanner.withm{flex-direction:row;align-items:center;gap:14px;text-align:left;padding:12px 28px 12px 16px}
.qbanner .bt{display:flex;flex-direction:column;gap:2px}
.qbanner.soft .bt,.qbanner.withm .bt{align-items:flex-start}
.result .mascot{margin:-6px auto -10px}
.empty .mascot{margin-bottom:-6px}
@media (max-width:520px){.qbanner.withm .mascot{--mpx:72px!important}}

/* ===== Tự lưu vào thư mục ===== */
.savechip{font-weight:600}
.savechip.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.savechip.warn{color:#9a6200;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface))}
.savechip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.fsnotice{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:1px solid var(--gold)}
.fsnotice span{flex:1;min-width:220px}
.fsrow{padding:8px 12px;border-radius:10px;background:var(--surface-2)}
.fsrow.ok{background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.fsrow.warn{background:color-mix(in srgb,var(--gold) 14%,var(--surface))}
.fsrow.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}

/* ===== Hình nền ===== */
.view{background:var(--bg)}
.stage{background:transparent!important}
#view[data-tone="dark"]{--bg:#0F161C;--surface:#172129;--surface-2:#1F2B35;--fg:#E7EDF2;--muted:#B5C2CC;--line:#33424F;--good:#22A055;--bad:#E5534B;color-scheme:dark;color:var(--fg)}
#view[data-tone="light"]{--bg:#F3F5F7;--surface:#FFFFFF;--surface-2:#E9EDF1;--fg:#14202B;--muted:#4F5C68;--line:#D5DCE3;--good:#15803D;--bad:#B42318;color-scheme:light;color:var(--fg)}
.bg-custom .gamebar{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px)}
.bg-custom .drawer{background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px)}
.bg-busy .qhead,.bg-busy .tstrip-head,.bg-busy .qctl,.bg-busy .hint,.bg-busy .stage-head,.bg-busy .section-title,.bg-busy .flip-top,.bg-busy .groups-top,.bg-busy .stats,.bg-busy .intro>.label,.bg-busy .intro>.note,.bg-busy .intro>h2{background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(8px);border-radius:14px;padding:6px 12px}
.bg-busy .tstrip{border-top:0}
.bgtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.bgtiles.compact{grid-template-columns:repeat(3,1fr);gap:6px}
.bgtile{position:relative;height:72px;border-radius:12px;border:2px solid var(--line);overflow:hidden;cursor:pointer;display:flex;align-items:flex-end;padding:0;background-size:cover}
.bgtiles.compact .bgtile{height:48px;border-radius:9px}
.bgtile span{width:100%;font-size:12px;font-weight:700;padding:3px 6px;background:color-mix(in srgb,var(--surface) 86%,transparent);color:var(--fg);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgtiles.compact .bgtile span{font-size:10.5px;padding:2px 4px}
.bgtile.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.bgtile.img:not([style]){background:repeating-linear-gradient(45deg,var(--surface-2) 0 10px,var(--surface) 10px 20px)}
.bgcolor{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}

/* ===== Danh sách bộ câu hỏi ===== */
.manage{grid-template-columns:280px minmax(0,1fr)}
@media (max-width:900px){.manage{grid-template-columns:1fr}}  /* màn hẹp: xếp một cột (dòng trên ghi đè quy tắc chung nên phải nhắc lại) */
.setside{display:flex;flex-direction:column;gap:10px;min-width:0;position:sticky;top:12px}
.setside>.btn{width:100%}
.setlist{display:flex;flex-direction:column;gap:6px}
.setitem{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.setitem:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.setitem[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.si-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:9px 10px 9px 12px;display:flex;flex-direction:column;gap:2px;font-weight:600}
.si-main .si-name{overflow-wrap:anywhere;line-height:1.3}
.si-main small{font-weight:400;color:var(--muted);font-size:12px}
.si-edit{margin:6px 0;font-weight:600}
.si-act{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:4px;border-left:1px solid var(--line);opacity:.55;transition:opacity .15s}
.setitem:hover .si-act,.setitem[aria-current="true"] .si-act,.si-act:focus-within{opacity:1}
.si-act button{width:30px;height:26px;border-radius:7px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.si-act button:hover{background:var(--surface-2);color:var(--fg)}
.si-act button.danger:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
@media (hover:none){.si-act{opacity:1}}
.toast{display:flex;align-items:center;gap:12px}
.toastbtn{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:3px 10px;font-weight:700;font-size:13px}
@media (max-width:900px){.setside{position:static}}

/* ===== Trang Bộ câu hỏi: bố cục rõ việc (tạo mới bên trái, sửa bộ đang mở bên phải), thùng rác ===== */
.subj{display:inline-flex;align-items:center;gap:6px}
.subj .scnt{min-width:18px;height:18px;padding:0 5px;border-radius:999px;font-size:11px;font-weight:700;line-height:18px;text-align:center;background:color-mix(in srgb,var(--accent) 14%,var(--surface-2));color:var(--accent)}
.subj[aria-pressed="true"] .scnt{background:rgba(255,255,255,.25);color:var(--accent-fg)}
.setside .side2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.setside .side2 .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap;padding-inline:8px}
.setitem{position:relative;border-left:4px solid var(--sc,var(--accent))}
.si-main{padding:10px 12px}
.si-main small .si-subj{font-weight:700;color:var(--sc,var(--accent))}
.si-act{flex-direction:row;align-items:center;gap:0;border-left:0;padding:0 6px;opacity:0}
.si-act button{width:30px;height:30px}
.setitem:hover .si-act,.setitem[aria-current="true"] .si-act,.si-act:focus-within{opacity:1}
@media (hover:none){.si-act{opacity:1}}
.trashbox{border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.trashbox summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px;list-style-position:inside}
.trashbox[open] summary{margin-bottom:8px}
.trashlist{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.titem{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border:1px dashed var(--line);border-radius:10px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.titem .tinfo{display:flex;flex-direction:column;min-width:0}
.titem .tinfo b{font-weight:600;overflow-wrap:anywhere;color:var(--muted)}
.titem .tinfo small{font-size:12px;color:var(--muted)}
.seteditor{gap:12px}
.ehead{display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:10px;align-items:center}
.ename{font-family:var(--f-display);font-weight:700;font-size:20px;padding:8px 12px!important;background:transparent!important;border-color:transparent!important}
.ename:hover{border-color:var(--line)!important}
.ename:focus{background:var(--bg)!important;border-color:var(--accent)!important;outline:none}
.esubj{font-weight:600}
#sPlay{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.toolbar{padding-bottom:12px;border-bottom:1px solid var(--line)}
.toolbar .btn{cursor:pointer}
.tsep{width:1px;height:22px;background:var(--line);margin:0 4px}
.esaved{margin-left:auto}
@media (max-width:900px){.ehead{grid-template-columns:1fr 1fr}.ename{grid-column:1/-1}.esaved{margin-left:0;width:100%}}

/* ===== Vòng quay: bảng chúc mừng 2 nút, phím tắt chỉ hiện trên máy tính, bố cục điện thoại ===== */
.only-touch{display:none}
@media (hover:none) and (pointer:coarse){.only-kbd{display:none!important}.only-touch{display:inline}}
.actions2{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.actions2 .btn{padding:14px 10px;font-size:17px}
.dropchk{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;cursor:pointer;align-self:center;padding:6px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.dropchk input{width:18px;height:18px;accent-color:var(--accent)}
.dropchk small{font-weight:500;color:var(--muted)}
.resfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:-4px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--muted);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn:hover{color:var(--bad)}
.resfoot .note{font-size:12px}
.stage-head .sh-btns{gap:6px;flex-wrap:nowrap}
@media (max-width:600px){
  /* thanh trên: logo + nút cùng một dòng, môn học thành dòng trượt ngang; đang chơi thì ẩn môn để nhường chỗ cho vòng */
  .topbar{gap:8px;padding-block:8px}
  .topbar .tools{margin-left:auto}
  .subjects{order:3}
  .app[data-view="game"] .subjects{display:none}
  .gamebar{flex-wrap:nowrap;gap:8px;padding-block:6px}
  .gamebar .ctx{display:none}
  .gamebar .title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .wheel-stage{gap:8px;padding:10px 18px 10px 10px}
  .stage-head{gap:6px}
  .stage-head .nm{display:none}
  .stats{font-size:13px}
  .result{padding:22px 16px 16px;gap:12px}
  .result .mascot{--mpx:72px!important}
  .resfoot{justify-content:center}
}
.wheel-wrap canvas{border-radius:50%}
@media (max-width:600px){
  .app[data-view="game"] .savechip{display:none}
  .topbar .brand{font-size:17px}
  .topbar .iconbtn{padding:6px 10px}
  .dropchk small{display:none}
}

/* ===== Vòng quay: câu hỏi tương tác trong bảng chúc mừng ===== */
.result.hasq{width:min(880px,100%);gap:12px;padding-top:20px}
.result.hasq .mascot{--mpx:64px!important}
.result.hasq #wMascot{display:none}
.result.hasq .who-label{display:none}
.result.hasq .who{font-size:clamp(28px,4.5vw,46px)}
.result.hasq .congrats{display:none}
.wq{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:12px}
.wq-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wq-head .label{margin:0}
.wq-tries{font-size:13px;font-weight:700;color:var(--accent)}
.wq-text{font-size:clamp(19px,2.6vw,28px);line-height:1.4;font-weight:500}
.wq-passage{font-size:.8em;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin-bottom:8px}
.wopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wopts.two .wopt{justify-content:center}
.wopt{display:flex;align-items:center;gap:12px;border:0;border-radius:14px;padding:12px 14px;min-height:60px;color:#fff;font-weight:600;font-size:clamp(17px,2.2vw,24px);text-align:left;cursor:pointer;transition:transform .15s,opacity .3s,filter .3s,box-shadow .3s}
.wopt b{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.22);font-family:var(--f-display)}
.wopt span{min-width:0;overflow-wrap:anywhere}
.wopt.o0{background:#D9644A}.wopt.o1{background:#2F6FA8}.wopt.o2{background:#C99A2E}.wopt.o3{background:#3C8C6E}
.wopt:not(:disabled):hover{transform:translateY(-2px)}
.wopt:disabled{cursor:default}
.wopt.ok{box-shadow:0 0 0 4px var(--good),0 0 22px color-mix(in srgb,var(--good) 60%,transparent);transform:scale(1.02)}
.wopt.ok b{background:var(--good)}
.wopt.ok b::after{content:""}
.wopt.bad{opacity:.38;filter:grayscale(.7);animation:wshake .4s}
.wopt.dim{opacity:.3;filter:grayscale(.6)}
@keyframes wshake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.wtf4{display:flex;flex-direction:column;gap:8px}
.wtfrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:clamp(16px,2vw,21px)}
.wtfrow .tl{font-weight:700;color:var(--muted)}
.wtfrow .tb{display:flex;gap:6px}
.wtfrow .tb button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:16px}
.wtfrow .tb button[data-v="1"][aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.wtfrow .tb button[data-v="0"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.wtfrow.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.wtfrow.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.wtfrow .tfix{grid-column:2/-1;font-size:14px;font-weight:700;color:var(--bad)}
.wq-check{align-self:center;min-width:160px}
.wshort{display:flex;gap:8px}
.wshort input{flex:1;min-width:0;font-size:22px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600}
.wshort input:focus{border-color:var(--accent);outline:none}
.wshort input.ok{border-color:var(--good);color:var(--good)}
.wshort input.bad{border-color:var(--bad);animation:wshake .4s}
.wq-fb{font-weight:700;font-size:18px;padding:8px 12px;border-radius:10px;background:var(--surface)}
.wq-fb.good{color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.wq-fb.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.wq-exp{font-size:16px;line-height:1.5;color:var(--fg);border-top:1px dashed var(--line);padding-top:8px}
/* Vòng quay (Chặng 1): Đúng xanh ngọc, Sai cam; đỏ chỉ dành cho đồng hồ sắp hết giờ */
:root{--ok2:#0B7A6E;--no2:#C2410C;--alarm:#D92D20}
:root[data-look="neon"]{--ok2:#2DD4BF;--no2:#FB923C;--alarm:#FF4D5E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok2:#2DD4BF;--no2:#FB923C;--alarm:#FF4D5E}}
:root[data-theme="dark"]{--ok2:#2DD4BF;--no2:#FB923C;--alarm:#FF4D5E}
#wOv{--good:var(--ok2);--bad:var(--no2)}
#wOv .timer.warn{color:var(--alarm)} #wOv .timer.done{background:var(--alarm)}
#wOv .pill.ok{color:var(--ok2);border-color:color-mix(in srgb,var(--ok2) 55%,var(--line))}
#wOv .pill.no{color:var(--no2);border-color:color-mix(in srgb,var(--no2) 55%,var(--line))}
#wOv .pill[aria-pressed="true"].ok,#wOv .pill[aria-pressed="true"].no{color:#fff}
/* Đ/S 4 ý: lựa chọn của học sinh tô màu trung tính; xanh ngọc/cam chỉ dành cho kết luận đúng/sai */
#wOv .wtfrow .tb button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.result.answered .ctlrow .minirow:first-child:not(:has(.timer.done)){display:none}
.result.answered .resfoot .note{display:none}
[data-look="neon"] #wOv .pill[aria-pressed="true"].ok,[data-look="neon"] #wOv .pill[aria-pressed="true"].no{color:#04121F;background:var(--good);border-color:var(--good)}
[data-look="neon"] #wOv .pill[aria-pressed="true"].no{background:var(--bad);border-color:var(--bad)}
.wq-tools{gap:6px}
.wq-head .sp{flex:1}
.wq-voice{white-space:nowrap}
.wq-voice[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.reading{outline:3px solid color-mix(in srgb,var(--gold) 80%,transparent);outline-offset:3px;border-radius:10px}
.wq-card{border:2px solid var(--accent);border-radius:16px;padding:12px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--accent) 8%,var(--surface));animation:cardin .35s ease-out}
.wq-card.good{border-color:var(--ok2);background:color-mix(in srgb,var(--ok2) 11%,var(--surface))}
.wq-card.bad{border-color:var(--no2);background:color-mix(in srgb,var(--no2) 11%,var(--surface))}
.wq-card-h{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.wq-card.good .wq-card-h{color:var(--ok2)} .wq-card.bad .wq-card-h{color:var(--no2)}
.wq-card-a{font-size:clamp(19px,2.4vw,26px);font-weight:700}
.wq-card .wq-exp{border-top:1px dashed var(--line);padding-top:6px;font-size:clamp(15px,1.7vw,18px)}
.wq-unfold{align-self:flex-start;text-decoration:none;color:var(--accent)}
@keyframes cardin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lessfx .wq-card{animation:none}
.result.answered .wq-text{font-size:clamp(17px,2.1vw,23px)}
.result.hasq{gap:10px}
.result.hasq .ctlrow{gap:8px 18px}
.result.answered .who{font-size:clamp(24px,3.4vw,36px)}
.result.answered .wtfrow{padding:4px 10px;font-size:clamp(15px,1.7vw,19px)}
.result.answered .wtfrow .tb button{height:32px}
.result.answered .wtf4{gap:6px}
.wq-card-a:empty,.wq-card-a[hidden]{display:none}
.result.answered .wq{gap:8px;padding-top:10px;padding-bottom:10px}
.w4{display:flex;align-items:center;justify-content:center;gap:10px}
.w4 .bx{width:clamp(48px,6vw,64px);height:clamp(56px,7vw,72px);border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font:700 clamp(30px,4vw,40px) var(--f-display);color:var(--fg)}
.w4 .bx.cur{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.w4 .bx.ok{border-color:var(--ok2);color:var(--ok2);box-shadow:0 0 14px color-mix(in srgb,var(--ok2) 45%,transparent)}
.w4 .bx.bad{border-color:var(--no2);color:var(--no2)}
.w4.shake{animation:wshake .4s}
.w4u,.wshort .w4u{font-size:clamp(18px,2.2vw,24px);font-weight:600;color:var(--muted);margin-left:4px;align-self:center}
.w4keys{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center}
.w4keys button[data-k]{min-width:40px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;color:var(--fg)}
.w4keys button[data-k]:hover{border-color:var(--accent)}
.w4keys .btn{margin-left:6px}
[data-look="neon"] .w4 .bx{background:#081321;border-color:var(--ring)}
[data-look="neon"] .w4 .bx.cur{border-color:var(--glow);box-shadow:0 0 12px color-mix(in srgb,var(--glow) 50%,transparent)}
[data-look="neon"] .w4 .bx.ok{border-color:var(--ok2)} [data-look="neon"] .w4 .bx.bad{border-color:var(--no2)}
[data-look="neon"] .w4keys button[data-k]{background:rgba(12,26,42,.85);border-color:var(--ring)}
[data-look="neon"] .wq-card{background:color-mix(in srgb,var(--glow) 8%,#081321)}
[data-look="neon"] .wq-card.good{background:color-mix(in srgb,var(--ok2) 12%,#081321);box-shadow:0 0 18px color-mix(in srgb,var(--ok2) 35%,transparent)}
[data-look="neon"] .wq-card.bad{background:color-mix(in srgb,var(--no2) 12%,#081321);box-shadow:0 0 18px color-mix(in srgb,var(--no2) 35%,transparent)}
@media (max-width:600px){.w4keys button[data-k]{min-width:34px;height:40px}.w4{gap:7px}}
@media (max-width:600px){.wopts{grid-template-columns:1fr}.wopts.two{grid-template-columns:1fr 1fr}.wopt{min-height:52px;padding:10px 12px}.wq{padding:12px}.result.hasq{padding:16px 12px 14px}}
.ctlrow{display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.ctlrow{flex-direction:row;justify-content:center;gap:22px;flex-wrap:wrap}}
.result.hasq .dropchk small{display:none}

/* =====================================================================
   GIAO DIỆN B "glow" (nổi khối, viền sáng) và C "neon" (neon đêm, mặc định).
   Giao diện A "classic" là toàn bộ phần phía trên, không đổi.
   Nguyên tắc: ánh sáng có chủ đích, chỉ chỗ quan trọng mới sáng (thẻ đang chọn,
   bảng chúc mừng, đáp án đúng, nút chính); chữ luôn đủ tương phản khi trình chiếu.
   ===================================================================== */
:root{--rim:var(--fg);--glow:#38D6FF}
.lookbtn i{width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--glow),#FF5FA8,#FFD24D,var(--glow));box-shadow:0 0 6px var(--glow)}
@media (max-width:600px){.lookbtn span{display:none}}
.looks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.looktile{display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.looktile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.looktile .lt-name{font-weight:700;font-family:var(--f-display)}
.looktile .lt-note{font-size:12.5px;color:var(--muted);line-height:1.35}
.lt-prev{height:64px;border-radius:10px;display:flex;align-items:center;gap:6px;padding:0 10px}
.lt-prev i{width:30px;height:30px;border-radius:9px;background:conic-gradient(#D9644A 0 25%,#2F6FA8 0 50%,#C99A2E 0 75%,#3C8C6E 0)}
.lt-prev b{flex:1;height:24px;border-radius:7px}
.lt-classic .lt-prev{background:#F3F5F7}.lt-classic .lt-prev b{background:#fff;border:1px solid #D5DCE3}
.lt-glow .lt-prev{background:linear-gradient(160deg,#eaf6fb,#f4f1fb)}.lt-glow .lt-prev b{background:#fff;box-shadow:0 4px 10px -3px rgba(16,40,60,.25),0 0 0 1.5px rgba(56,214,255,.55),0 0 10px rgba(56,214,255,.35)}
.lt-neon .lt-prev{background:#070F1A}.lt-neon .lt-prev b{background:#0B1A2B;border:1.5px solid #38D6FF;box-shadow:0 0 8px rgba(56,214,255,.6)}
.lt-neon .lt-prev b+b{border-color:#FF5FA8;box-shadow:0 0 8px rgba(255,95,168,.6)}

/* ---------- B. Nổi khối, viền sáng ---------- */
[data-look="glow"]{--sh1:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(16,40,60,.06),0 8px 22px -8px rgba(16,40,60,.18);
  --halo:0 0 0 2px color-mix(in srgb,var(--glow) 60%,transparent),0 0 20px color-mix(in srgb,var(--glow) 40%,transparent)}
[data-look="glow"] .topbar,[data-look="glow"] .gamebar{box-shadow:0 6px 18px -12px rgba(16,40,60,.35)}
[data-look="glow"] :is(.panel,.gcard,.group,.team,.tchip,.qcard,.setitem,.wq,.ansbox,.titem,.looktile,.stage-head){box-shadow:var(--sh1)}
[data-look="glow"] .gcard:hover,[data-look="glow"] .setitem[aria-current="true"],[data-look="glow"] .tchip.answering,[data-look="glow"] .team.turn,[data-look="glow"] .looktile[aria-pressed="true"]{box-shadow:var(--sh1),var(--halo)}
[data-look="glow"] .btn,[data-look="glow"] .iconbtn{box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 2px 6px -3px rgba(16,40,60,.25)}
[data-look="glow"] .btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 82%,#fff),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
[data-look="glow"] .subj[aria-pressed="true"]{box-shadow:0 4px 12px -4px color-mix(in srgb,var(--accent) 70%,transparent),0 0 0 2px color-mix(in srgb,var(--glow) 45%,transparent)}
[data-look="glow"] .result{border-top-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--glow) 55%,transparent),0 0 36px color-mix(in srgb,var(--glow) 40%,transparent),0 30px 80px rgba(0,0,0,.35)}
[data-look="glow"] :is(.opt,.wopt){box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.14),0 6px 14px -6px rgba(0,0,0,.4)}
[data-look="glow"] :is(.opt.right,.wopt.ok){box-shadow:0 0 0 4px #7CF2B8,0 0 26px rgba(60,220,150,.65)}
[data-look="glow"] .wheel-wrap canvas{filter:drop-shadow(0 14px 26px rgba(16,40,60,.28)) drop-shadow(0 0 14px color-mix(in srgb,var(--glow) 35%,transparent))}

/* ---------- C. Neon đêm ---------- */
:root[data-look="neon"]{
  --bg:#070F1A; --surface:#0C1A2A; --surface-2:#13263A; --fg:#EAF4FF; --muted:#9FB4C9; --line:rgba(120,200,255,.24);
  --good:#3EE6A0; --bad:#FF5C7A; --gold:#FFD24D; --accent-fg:#04121F; --rim:#06101C;
  --a1:#FF5C5C; --a2:#4D8DFF; --a3:#F5B82E; --a4:#B07CFF; color-scheme:dark;
  --ring:color-mix(in srgb,var(--glow) 55%,transparent);
  --n1:0 0 0 1px color-mix(in srgb,var(--glow) 18%,transparent),0 0 14px color-mix(in srgb,var(--glow) 22%,transparent),inset 0 0 18px color-mix(in srgb,var(--glow) 7%,transparent);
  --n2:0 0 0 1px var(--glow),0 0 18px color-mix(in srgb,var(--glow) 55%,transparent),inset 0 0 18px color-mix(in srgb,var(--glow) 14%,transparent)}
[data-look="neon"] body{background:#070F1A}
[data-look="neon"] .topbar,[data-look="neon"] .gamebar{background:rgba(7,15,26,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--ring);box-shadow:0 1px 14px -4px color-mix(in srgb,var(--glow) 45%,transparent)}
[data-look="neon"] .brand{text-shadow:0 0 10px color-mix(in srgb,var(--glow) 60%,transparent)}
[data-look="neon"] :is(.panel,.gcard,.group,.team,.tchip,.qcard,.setitem,.wq,.ansbox,.titem,.looktile,.drawer,.card .f,.fc .f,.fc .b,.chip,.stage-head){border-color:var(--ring);box-shadow:var(--n1)}
[data-look="neon"] .drawer{background:rgba(9,20,33,.96)}
[data-look="neon"] .gcard .art{background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--glow) 16%,transparent),transparent 70%),#0A1625;border-bottom-color:var(--ring)}
[data-look="neon"] :is(.gcard:hover,.setitem[aria-current="true"],.tchip.answering,.team.turn,.looktile[aria-pressed="true"]){border-color:var(--glow);box-shadow:var(--n2)}
[data-look="neon"] :is(.btn,.iconbtn,.pill,.seg,.subj){background:rgba(12,26,42,.85);border-color:var(--ring)}
[data-look="neon"] :is(.btn,.iconbtn):hover{border-color:var(--glow);box-shadow:0 0 12px color-mix(in srgb,var(--glow) 40%,transparent)}
[data-look="neon"] .btn.primary{background:color-mix(in srgb,var(--glow) 16%,#081321);color:var(--glow);border:1.5px solid var(--glow);text-shadow:0 0 8px color-mix(in srgb,var(--glow) 70%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--glow) 45%,transparent),inset 0 0 12px color-mix(in srgb,var(--glow) 20%,transparent)}
[data-look="neon"] .btn.primary:hover{background:color-mix(in srgb,var(--glow) 26%,#081321)}
[data-look="neon"] .btn.primary:disabled{opacity:.45;box-shadow:none}
[data-look="neon"] :is(.subj[aria-pressed="true"],.seg button[aria-pressed="true"]){background:var(--glow);color:var(--accent-fg);box-shadow:0 0 14px color-mix(in srgb,var(--glow) 65%,transparent)}
[data-look="neon"] :is(select,input[type=text],input[type=number],textarea){background:#081321;border-color:var(--ring)}
[data-look="neon"] :is(select,input[type=text],input[type=number],textarea):focus{border-color:var(--glow);box-shadow:0 0 0 3px color-mix(in srgb,var(--glow) 25%,transparent);outline:none}
[data-look="neon"] .label{color:color-mix(in srgb,var(--glow) 55%,var(--muted))}
[data-look="neon"] h2,[data-look="neon"] .section-title h2{text-shadow:0 0 14px color-mix(in srgb,var(--glow) 35%,transparent)}
[data-look="neon"] .toast{background:#EAF4FF;color:#06101C;box-shadow:0 0 22px color-mix(in srgb,var(--glow) 55%,transparent)}
[data-look="neon"] .overlay{background:rgba(2,6,12,.72)}
/* Bảng chúc mừng: viền neon chạy vòng quanh (tắt khi bật "Giảm hiệu ứng") */
@property --nang{syntax:"<angle>";inherits:false;initial-value:0deg}
[data-look="neon"] .result{border:3px solid transparent;border-top-width:3px;
  background:linear-gradient(#0B1828,#0B1828) padding-box,conic-gradient(from var(--nang),var(--glow),#FF5FA8,#FFD24D,var(--glow)) border-box;
  box-shadow:0 0 28px color-mix(in srgb,var(--glow) 45%,transparent),0 0 70px rgba(255,95,168,.18),0 30px 80px rgba(0,0,0,.6);animation:pop .5s cubic-bezier(.2,1.5,.4,1),nspin 4s linear infinite}
@keyframes nspin{to{--nang:360deg}}
[data-look="neon"] .who-label{color:var(--glow);text-shadow:0 0 8px var(--glow)}
[data-look="neon"] .who{text-shadow:0 0 12px color-mix(in srgb,var(--glow) 75%,transparent),0 0 30px color-mix(in srgb,var(--glow) 35%,transparent)}
[data-look="neon"] .wq{background:#081321}
/* Phương án trả lời: nền tối pha màu, viền phát sáng (chữ trắng, đọc rõ trên máy chiếu) */
[data-look="neon"] .opt:not(.hasimg).o0,[data-look="neon"] .wopt.o0{--oc:var(--a1)}
[data-look="neon"] .opt:not(.hasimg).o1,[data-look="neon"] .wopt.o1{--oc:var(--a2)}
[data-look="neon"] .opt:not(.hasimg).o2,[data-look="neon"] .wopt.o2{--oc:var(--a3)}
[data-look="neon"] .opt:not(.hasimg).o3,[data-look="neon"] .wopt.o3{--oc:var(--a4)}
[data-look="neon"] :is(.opt:not(.hasimg),.wopt){background:color-mix(in srgb,var(--oc) 26%,#081321);border:2px solid var(--oc);color:#fff;box-shadow:0 0 12px color-mix(in srgb,var(--oc) 45%,transparent),inset 0 0 14px color-mix(in srgb,var(--oc) 18%,transparent)}
[data-look="neon"] .wopt b{background:var(--oc);color:#06101C}
[data-look="neon"] :is(.opt.right,.wopt.ok){--oc:var(--good)!important;background:color-mix(in srgb,var(--good) 32%,#081321);box-shadow:0 0 0 3px var(--good),0 0 30px color-mix(in srgb,var(--good) 70%,transparent)}
[data-look="neon"] .wq-fb.good{background:color-mix(in srgb,var(--good) 16%,#081321)}
[data-look="neon"] .wq-fb.bad{background:color-mix(in srgb,var(--bad) 14%,#081321)}
[data-look="neon"] .wtfrow{background:#0C1A2A}
[data-look="neon"] .wtfrow .tb button{background:#081321}
/* Vòng quay: quầng sáng quanh vòng, kim phát sáng */
[data-look="neon"] .wheel-wrap canvas{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--glow) 70%,transparent)) drop-shadow(0 0 28px color-mix(in srgb,var(--glow) 30%,transparent))}
[data-look="neon"] .pointer{filter:drop-shadow(0 0 6px var(--glow))}
[data-look="neon"] .pointer path{fill:var(--glow)}
[data-look="neon"] .pointer circle{fill:#06101C}
[data-look="neon"] .card .b{box-shadow:0 0 14px color-mix(in srgb,var(--glow) 45%,transparent)}
[data-look="neon"] .group header{text-shadow:0 1px 2px rgba(0,0,0,.4)}
[data-look="neon"] .savechip.warn{color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,#0C1A2A)}
[data-look="neon"] .savechip.ok{color:var(--good)}
@media (max-width:600px){.savechip:not(.warn):not(.bad){display:none}}
.bgnote{display:block;margin-top:8px}

/* ===== Đồng hồ đếm giờ: nảy theo tiếng tích, 5 giây cuối đỏ và to dần ===== */
.timer,.tnum{display:inline-block;transform:scale(calc(1 + var(--u,0) * .35));transition:transform .15s}
.timer.warn,.tnum.warn{color:var(--bad);animation:none}
.timer.pulse,.tnum.pulse{animation:tpulse .18s ease-out}
@keyframes tpulse{40%{transform:scale(calc(1.14 + var(--u,0) * .4))}}
[data-look="neon"] .timer.warn,[data-look="neon"] .tnum.warn{text-shadow:0 0 calc(6px + var(--u,0) * 14px) var(--bad)}
/* ===== Bảng chúc mừng có câu hỏi: tự co theo chiều cao màn hình (máy chiếu 720p, laptop) ===== */
.ctlrow{align-items:center}
.ctlrow .dropchk{align-self:center}
.result.hasq{gap:clamp(6px,1.4vh,12px);padding-top:clamp(12px,2vh,20px);padding-bottom:clamp(10px,1.8vh,22px)}
.result.hasq .who{font-size:clamp(24px,min(4.5vw,5.2vh),46px);line-height:1.15}
.result.hasq .wq{gap:clamp(6px,1.2vh,12px);padding:clamp(10px,1.6vh,14px) 16px}
.result.hasq .wq-text{font-size:clamp(18px,min(2.6vw,3.4vh),28px);line-height:1.35}
.result.hasq .wopt{min-height:clamp(42px,6.8vh,60px);padding-block:clamp(6px,1.1vh,12px);font-size:clamp(16px,min(2.2vw,3vh),24px)}
.result.hasq .wopt b{width:clamp(28px,4vh,34px);height:clamp(28px,4vh,34px)}
.result.hasq .actions2 .btn{padding-block:clamp(8px,1.5vh,14px)}
.result.hasq .wtfrow{padding-block:clamp(4px,.8vh,8px)}
.result.hasq .wtfrow .tb button{height:clamp(32px,4.6vh,40px)}
/* Tia sáng sau cá heo: quay bằng góc của dải màu (không xoay cả lớp), nên không lòi ra ngoài làm bảng phải cuộn */
@property --ra{syntax:"<angle>";inherits:false;initial-value:0deg}
.result::before{inset:0!important;height:auto!important;transform:none!important;
  background:conic-gradient(from var(--ra) at 50% 70px,transparent 0 20deg,color-mix(in srgb,var(--gold) 22%,transparent) 20deg 30deg,transparent 30deg 60deg,transparent 60deg 80deg,color-mix(in srgb,var(--gold) 22%,transparent) 80deg 90deg,transparent 90deg 120deg,transparent 120deg 140deg,color-mix(in srgb,var(--gold) 22%,transparent) 140deg 150deg,transparent 150deg 180deg,transparent 180deg 200deg,color-mix(in srgb,var(--gold) 22%,transparent) 200deg 210deg,transparent 210deg 240deg,transparent 240deg 260deg,color-mix(in srgb,var(--gold) 22%,transparent) 260deg 270deg,transparent 270deg 300deg,transparent 300deg 320deg,color-mix(in srgb,var(--gold) 22%,transparent) 320deg 330deg,transparent 330deg);
  -webkit-mask-image:radial-gradient(circle at 50% 70px,#000 0 90px,transparent 230px);mask-image:radial-gradient(circle at 50% 70px,#000 0 90px,transparent 230px);
  animation:rays2 14s linear infinite}
@keyframes rays2{to{--ra:360deg}}

/* ===== Kho câu hỏi soạn sẵn ===== */

  background:#C2410C;color:#fff;font-size:14px;line-height:1.35;box-shadow:0 2px 6px rgba(0,0,0,.25)}

/* Đ/S 4 ý sau khi kiểm tra: ý sai → nút đúng có vòng xanh ngọc + dấu ✓ (không thêm dòng, giữ vừa màn chiếu) */
.wtfrow .tb button.should{position:relative;border:2px solid var(--ok2);color:var(--ok2);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok2) 30%,transparent)}
.wtfrow .tb button.should::after{content:"✓";position:absolute;top:-9px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--ok2);color:#04121F;font-size:12px;line-height:18px;text-align:center}
