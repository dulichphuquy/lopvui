<script>
/* ===== src/core.js ===== */
/* =========================================================
   LÕI DÙNG CHUNG: dữ liệu, bộ đọc câu hỏi, âm thanh, hiệu ứng.
   Mọi trò chơi đều dùng các hàm trong App, không tự lưu dữ liệu riêng.
   ========================================================= */
"use strict";
const App = window.App = { games: {}, order: [] };
App.VERSION = "1.4"; App.BUILD = "873f6fe"; App.RELEASED = false; App.WEB = true; App.THU = true;

/* ---------- Tiện ích ---------- */
App.$ = id => document.getElementById(id);
App.esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
App.rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return Math.floor(a[0] / 4294967296 * n); };
App.shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = App.rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
/* Giảm hiệu ứng: do giáo viên bật trong Cài đặt chung (không tự theo "Giảm chuyển động" của máy,
   vì máy bật mục đó làm vòng quay chỉ còn 1 giây và mất pháo giấy khi trình chiếu cho cả lớp). */
Object.defineProperty(App, "reduce", { get: () => !!(App.S && App.S.prefs && App.S.prefs.lessFx) });
App.css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
App.toast = (m, action) => {
  const t = App.$("toast"); t.textContent = m; t.hidden = false; clearTimeout(App.toast.t);
  if (action) { const b = document.createElement("button"); b.className = "toastbtn"; b.textContent = action.label; b.onclick = () => { t.hidden = true; action.fn(); }; t.appendChild(b); }
  App.toast.t = setTimeout(() => t.hidden = true, action ? 8000 : 3200);
};
App.uid = p => p + Date.now().toString(36) + App.rnd(1e6).toString(36);
/* Viết gọn: x^2 → x², H_2O → H₂O */
const SUP = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "-": "⁻", "+": "⁺", "n": "ⁿ" };
const SUB = { "0": "₀", "1": "₁", "2": "₂", "3": "₃", "4": "₄", "5": "₅", "6": "₆", "7": "₇", "8": "₈", "9": "₉", "+": "₊", "-": "₋" };
App.fmt = s => String(s ?? "").replace(/\^\{([0-9+\-n]+)\}|\^([0-9+\-n]+)/g, (m, a, b) => [...(a || b)].map(c => SUP[c] || c).join(""))
  .replace(/_\{([0-9+\-]+)\}|_([0-9]+)/g, (m, a, b) => [...(a || b)].map(c => SUB[c] || c).join(""));
/* Chữ có định dạng: $công thức$, ![](img:mã), ^{chỉ số trên}, _{chỉ số dưới}, xuống dòng */
const TOKEN = /(\$[^$\n]+\$|!\[[^\]\n]*\]\(img:[\w-]+\))/;
App.html = s => String(s ?? "").split(TOKEN).map((part, i) => {
  if (i % 2) {
    if (part[0] === "$") return App.math ? App.math.toMathML(part.slice(1, -1)) : App.esc(part);
    const m = part.match(/^!\[([^\]]*)\]\(img:([\w-]+)\)$/), url = App.img && App.img.url(m[2]);
    return url ? `<img class="qimg" src="${url}" alt="${App.esc(m[1] || "Hình")}" data-zoom>` : `<span class="imgmiss">[Thiếu hình]</span>`;
  }
  return App.esc(part).replace(/\^\{([^{}]*)\}/g, "<sup>$1</sup>").replace(/_\{([^{}]*)\}/g, "<sub>$1</sub>").replace(/\n/g, "<br>")
    .replace(/\^([0-9+\-n]+)/g, (m, a) => [...a].map(c => SUP[c] || c).join("")).replace(/_([0-9]+)(?![0-9]*[a-zA-Z])/g, (m, a) => [...a].map(c => SUB[c] || c).join(""));
}).join("");
/* Chữ thuần (đọc to, sao chép): bỏ công thức, hình */
App.plain = s => String(s ?? "").replace(/!\[[^\]]*\]\(img:[\w-]+\)/g, "[hình]").replace(/\$([^$\n]+)\$/g, "$1").replace(/[{}\\]/g, "");
App.hasImg = s => /!\[[^\]]*\]\(img:[\w-]+\)/.test(String(s || ""));

/* ---------- Môn học: màu, họa tiết, bảng màu lát, tên nhóm ---------- */
const svgPat = (w, h, body) => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}'>${body}</svg>`)}")`;
const ink = "rgba(128,140,150,0.28)";
App.SUBJECTS = {
  chung: { name: "Chung", accent: "#2F5D8A", pattern: "none",
    pal: [["#2F5D8A", "#fff"], ["#E9B44C", "#1b1b1b"], ["#5A8F7B", "#fff"], ["#D9644A", "#fff"], ["#8AA6C1", "#14202B"], ["#F1E3C6", "#14202B"]],
    teams: ["Đại bàng", "Cá heo", "Hổ", "Voi", "Sói", "Gấu", "Cáo", "Sư tử", "Báo", "Rùa", "Ong", "Cú"] },
  toan: { name: "Toán", accent: "#1D4ED8", pattern: svgPat(24, 24, `<path d='M24 0H0V24' fill='none' stroke='${ink}'/>`),
    pal: [["#1D4ED8", "#fff"], ["#93C5FD", "#0B1B3A"], ["#0F172A", "#fff"], ["#FACC15", "#1b1b1b"], ["#60A5FA", "#0B1B3A"], ["#E2E8F0", "#0F172A"]],
    teams: ["Pythagoras", "Euclid", "Thales", "Lương Thế Vinh", "Descartes", "Fermat", "Pascal", "Euler", "Gauss", "Fibonacci", "Archimedes", "Newton"] },
  ly: { name: "Vật lí", accent: "#0E7490", pattern: svgPat(80, 30, `<path d='M0 15 Q10 3 20 15 T40 15 T60 15 T80 15' fill='none' stroke='${ink}' stroke-width='1.2'/>`),
    pal: [["#0E7490", "#fff"], ["#F59E0B", "#1b1b1b"], ["#164E63", "#fff"], ["#67E8F9", "#083344"], ["#334155", "#fff"], ["#FDE68A", "#1b1b1b"]],
    teams: ["Newton", "Galileo", "Einstein", "Faraday", "Curie", "Tesla", "Maxwell", "Ohm", "Volta", "Kepler", "Pascal", "Joule"] },
  hoa: { name: "Hóa học", accent: "#0F766E", pattern: svgPat(56, 48, `<path d='M14 1 L42 1 L56 24 L42 47 L14 47 L0 24 Z' fill='none' stroke='${ink}'/>`),
    pal: [["#0F766E", "#fff"], ["#A7F3D0", "#064E3B"], ["#7C3AED", "#fff"], ["#FB923C", "#1b1b1b"], ["#134E4A", "#fff"], ["#E0F2F1", "#134E4A"]],
    teams: ["Hiđro", "Heli", "Liti", "Cacbon", "Nitơ", "Oxi", "Natri", "Magie", "Nhôm", "Silic", "Photpho", "Lưu huỳnh"] },
  sinh: { name: "Sinh học", accent: "#4D7C0F", pattern: svgPat(40, 40, `<circle cx='20' cy='20' r='9' fill='none' stroke='${ink}'/><circle cx='20' cy='20' r='3' fill='${ink}'/>`),
    pal: [["#4D7C0F", "#fff"], ["#D9F99D", "#1A2E05"], ["#166534", "#fff"], ["#FCD34D", "#1b1b1b"], ["#A16207", "#fff"], ["#ECFCCB", "#1A2E05"]],
    teams: ["Mendel", "Darwin", "Pasteur", "Lục lạp", "Ti thể", "Ribôxôm", "Gen", "Enzim", "Nơron", "Hồng cầu", "Rễ", "Lá"] },
  van: { name: "Ngữ văn", accent: "#9F1239", pattern: svgPat(10, 30, `<path d='M0 29.5H10' stroke='${ink}'/>`),
    pal: [["#9F1239", "#fff"], ["#F5E6D3", "#3B1020"], ["#4C1D2B", "#fff"], ["#E8B4BC", "#3B1020"], ["#B45309", "#fff"], ["#FBF3EA", "#3B1020"]],
    teams: ["Nguyễn Du", "Nguyễn Trãi", "Hồ Xuân Hương", "Nguyễn Khuyến", "Tú Xương", "Nam Cao", "Xuân Diệu", "Huy Cận", "Thạch Lam", "Hàn Mặc Tử", "Tố Hữu", "Nguyễn Đình Chiểu"] },
  anh: { name: "Tiếng Anh", accent: "#C2410C", pattern: svgPat(18, 18, `<circle cx='9' cy='9' r='1.6' fill='${ink}'/>`),
    pal: [["#C2410C", "#fff"], ["#1E3A8A", "#fff"], ["#FDBA74", "#1b1b1b"], ["#0EA5E9", "#fff"], ["#FFF7ED", "#7C2D12"], ["#DC2626", "#fff"]],
    teams: ["London", "Sydney", "Toronto", "Dublin", "Boston", "Oxford", "Cambridge", "Chicago", "Auckland", "Edinburgh", "Seattle", "Melbourne"] },
  su: { name: "Lịch sử", accent: "#92400E", pattern: svgPat(120, 120, `<g fill='none' stroke='${ink}'><circle cx='60' cy='60' r='16'/><circle cx='60' cy='60' r='30'/><circle cx='60' cy='60' r='46'/></g>`),
    pal: [["#92400E", "#fff"], ["#E7D3B0", "#3A2208"], ["#3F3F46", "#fff"], ["#B91C1C", "#fff"], ["#CA8A04", "#1b1b1b"], ["#F5EBDD", "#3A2208"]],
    teams: ["Bạch Đằng", "Chi Lăng", "Như Nguyệt", "Đống Đa", "Rạch Gầm", "Chương Dương", "Hàm Tử", "Xương Giang", "Ngọc Hồi", "Tốt Động", "Vạn Kiếp", "Điện Biên"] }
};
App.TEAM_COLORS = ["#D63B3B", "#2563EB", "#D69E00", "#16884A", "#7C3AED", "#DB2777", "#0891B2", "#EA580C", "#4D7C0F", "#475569", "#B45309", "#0F766E"];

/* ---------- Dữ liệu mẫu ---------- */
const SAMPLE_NAMES = ["Nguyễn Văn An, Nam", "Trần Thị Bảo Anh, Nữ", "Lê Minh Châu, Nữ", "Phạm Quốc Cường, Nam", "Võ Thị Diễm, Nữ", "Huỳnh Gia Huy, Nam", "Đặng Ngọc Hân, Nữ", "Bùi Tuấn Khang, Nam", "Ngô Thảo Linh, Nữ", "Dương Văn Lộc, Nam", "Lý Thị Mai, Nữ", "Phan Nhật Minh, Nam", "Hồ Bảo Ngọc, Nữ", "Đỗ Thành Nhân, Nam", "Trương Mỹ Phương, Nữ", "Mai Đức Quân, Nam", "Tạ Thu Quyên, Nữ", "Châu Văn Sang, Nam", "Nguyễn Thị Thanh Tâm, Nữ", "Lê Hoàng Thắng, Nam", "Trần Anh Thư, Nữ", "Phạm Minh Trí, Nam", "Vũ Ngọc Trâm, Nữ", "Nguyễn Hữu Tuấn, Nam", "Lê Thị Tường Vi, Nữ", "Đinh Quang Vinh, Nam", "Trần Văn An, Nam", "Hà Khánh Vy, Nữ"];
const SAMPLE_SET_LY = `# Vật lí 10 – Động học (mẫu)

? Đơn vị của gia tốc trong hệ SI là gì?
* m/s^2
- m/s
- m.s
- km/h

? Gia tốc rơi tự do gần mặt đất xấp xỉ bằng
- 8,9 m/s^2
* 9,8 m/s^2
- 10,8 m/s^2
- 98 m/s^2
! Thường lấy g ≈ 9,8 m/s², làm tròn g ≈ 10 m/s² khi tính nhanh.

? Công thức vận tốc của chuyển động thẳng biến đổi đều là
* v = v_0 + at
- v = v_0 + at^2
- v = at^2/2
- v = s/t^2

? Vật rơi tự do có gia tốc không đổi.
= Đúng

? Một ô tô đi 120 km trong 2 giờ. Tốc độ trung bình bằng bao nhiêu?
= 60 km/h

? Khối lượng là đại lượng vectơ.
= Sai
! Khối lượng là đại lượng vô hướng.

Vận tốc :: m/s
Gia tốc :: m/s^2
Lực :: N (Niutơn)
Công :: J (Jun)
Công suất :: W (Oát)
Áp suất :: Pa (Paxcan)
Động lượng :: kg.m/s
Tần số :: Hz (Héc)`;
const SAMPLE_SET_ANH = `# Tiếng Anh – Từ vựng môi trường (mẫu)

pollution :: sự ô nhiễm
recycle :: tái chế
deforestation :: nạn phá rừng
renewable energy :: năng lượng tái tạo
global warming :: sự nóng lên toàn cầu
endangered species :: loài có nguy cơ tuyệt chủng
climate change :: biến đổi khí hậu
carbon footprint :: lượng khí thải các-bon

? Which word means "to use something again"?
- reduce
* reuse
- refuse
- remove`;

App.SETTINGS_DEFAULT = { volume: 70, speak: false, voiceName: "", rate: 1, mascot: true, lessFx: false, look: "neon" };
/* Giao diện: A "classic" (thanh lịch, phẳng), B "glow" (nổi khối, viền sáng), C "neon" (neon đêm, mặc định).
   Màu neon riêng cho từng môn: sáng, bão hòa, đủ tương phản trên nền tối. */
App.LOOKS = { neon: { name: "Neon đêm", note: "Nền tối, viền phát sáng theo màu môn. Ấn tượng trên TV, phòng tối, sự kiện." }, glow: { name: "Nổi khối, viền sáng", note: "Nền sáng, đổ bóng nhiều lớp, quầng sáng ở chỗ quan trọng." }, classic: { name: "Thanh lịch", note: "Phẳng, rõ chữ nhất khi máy chiếu yếu hoặc lớp rất sáng." } };
App.NEON = { chung: "#38D6FF", toan: "#5B9BFF", ly: "#38D6FF", hoa: "#3DF5D0", sinh: "#9BFF5C", van: "#FF5FA8", anh: "#FFA24D", su: "#FFD24D" };
App.look = () => App.LOOKS[App.S.prefs.look] ? App.S.prefs.look : "neon";
function defaults() {
  return {
    v: 1, subject: "ly", cur: "c1", curSet: "s1", prefs: { ...App.SETTINGS_DEFAULT }, games: {}, groups: {},
    classes: [{ id: "c1", name: "10A1 (lớp mẫu)", raw: SAMPLE_NAMES.join("\n"), absent: ["Hà Khánh Vy"], picked: [], scores: {}, hist: [] }],
    sets: [{ id: "s1", name: "Vật lí 10 – Động học (mẫu)", subject: "ly", raw: SAMPLE_SET_LY, used: [] },
           { id: "s2", name: "Tiếng Anh – Từ vựng môi trường (mẫu)", subject: "anh", raw: SAMPLE_SET_ANH, used: [] }]
  };
}

/* ---------- Kho dữ liệu ---------- */
/* Bản thử (…/lopvui/thu/) cùng "nhà" với bản chính trong trình duyệt, nên dùng NGĂN RIÊNG:
   khóa "lopvui-thu.v1", kho hình "lopvui-thu-img", không nối thư mục LopVui (xem fsync.js).
   Lần đầu mở: chép một bản sao dữ liệu của bản chính để thử trên dữ liệu thật mà không đụng bản thật. */
const KEY_CHINH = "lopvui.v1";
const KEY = App.THU ? "lopvui-thu.v1" : KEY_CHINH;
const banSaoChinh = () => { try { const d = JSON.parse(localStorage.getItem(KEY_CHINH)); return d && Array.isArray(d.classes) && d.classes.length ? d : null; } catch (e) { return null; } };
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (App.THU && (!S || !Array.isArray(S.classes) || !S.classes.length)) {
  const d = banSaoChinh(); if (d) { S = d; delete S.fresh; S.thuCopied = Date.now(); }
}
if (!S || !Array.isArray(S.classes) || !S.classes.length) {
  S = defaults(); S.fresh = true;
  // Nhận lại dữ liệu từ bản Vòng Quay Gọi Tên cũ nếu có
  try {
    const old = JSON.parse(localStorage.getItem("vongquay.v1"));
    if (old && old.classes && old.classes.length) {
      S.classes = old.classes.map(c => ({ id: c.id, name: c.name, raw: c.raw, absent: c.absent || [], picked: c.picked || [], scores: c.scores || {}, hist: c.hist || [] }));
      S.cur = old.cur || S.classes[0].id;
    }
  } catch (e) { }
}
S = Object.assign(defaults(), S);
S.prefs = Object.assign({ ...App.SETTINGS_DEFAULT }, S.prefs);
App.S = S;
/* Bản thử: bỏ dữ liệu đang thử, lấy lại bản sao mới nhất của bản chính (bản chính không bị đụng tới) */
App.thuLayLai = () => {
  if (!App.THU) return false; const d = banSaoChinh(); if (!d) return false;
  delete d.fresh; d.thuCopied = Date.now(); clearTimeout(saveT); saveT = 0;
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { return false; }
  location.reload(); return true;
};
let saveT;

/* ---------- Kho hình ảnh (IndexedDB, chạy offline, chứa được hàng trăm MB) ---------- */
App.img = (() => {
  const urls = new Map(), meta = new Map(); let db = null, dbChinh = null;
  const moDb = ten => new Promise(res => {
    try { const r = indexedDB.open(ten, 1); r.onupgradeneeded = () => r.result.createObjectStore("img"); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }
    catch (e) { res(null); }
  });
  // Bản thử: ghi vào kho hình riêng; hình của bản chính chỉ ĐỌC (để bộ câu hỏi chép sang vẫn hiện hình)
  const open = async () => { db = await moDb(App.THU ? "lopvui-thu-img" : "lopvui-img"); if (App.THU) dbChinh = await moDb("lopvui-img"); };
  const docHet = d => new Promise(res => { if (!d) return res(); try { const t = d.transaction("img"), r = t.objectStore("img").openCursor(); r.onsuccess = () => { const cur = r.result; if (!cur) return res(); const v = cur.value; if (!urls.has(cur.key) && v && v.blob) { urls.set(cur.key, URL.createObjectURL(v.blob)); meta.set(cur.key, { w: v.w, h: v.h, type: v.blob.type }); } cur.continue(); }; r.onerror = () => res(); } catch (e) { res(); } });
  const tx = (mode, fn) => new Promise(res => { if (!db) return res(null); try { const t = db.transaction("img", mode), st = t.objectStore("img"); const r = fn(st); t.oncomplete = () => res(r && r.result); t.onerror = () => res(null); } catch (e) { res(null); } });
  const hash = async bytes => { let h1 = 0x811c9dc5, h2 = 0x01000193; for (let i = 0; i < bytes.length; i++) { h1 = Math.imul(h1 ^ bytes[i], 16777619); h2 = Math.imul(h2 + bytes[i], 2246822507); } return (h1 >>> 0).toString(36) + (h2 >>> 0).toString(36) + bytes.length.toString(36); };
  const dims = blob => new Promise(res => { const u = URL.createObjectURL(blob), im = new Image(); im.onload = () => { res({ w: im.naturalWidth, h: im.naturalHeight, im, u }); }; im.onerror = () => res(null); im.src = u; });
  /* Thu nhỏ ảnh lớn cho vừa máy chiếu, giữ PNG cho hình vẽ nét, JPEG cho ảnh chụp */
  async function shrink(blob) {
    const d = await dims(blob); if (!d) return null;
    const max = 1600, big = Math.max(d.w, d.h) > max, heavy = blob.size > 450000;
    if (!big && !heavy) { URL.revokeObjectURL(d.u); return { blob, w: d.w, h: d.h }; }
    const k = Math.min(1, max / Math.max(d.w, d.h)), c = document.createElement("canvas");
    c.width = Math.round(d.w * k); c.height = Math.round(d.h * k);
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(d.im, 0, 0, c.width, c.height); URL.revokeObjectURL(d.u);
    const out = await new Promise(r => c.toBlob(r, blob.type === "image/png" && !heavy ? "image/png" : "image/jpeg", .85));
    return { blob: out || blob, w: c.width, h: c.height };
  }
  return {
    async init() {
      await open(); if (!db) return;
      await new Promise(res => { try { const t = db.transaction("img"), r = t.objectStore("img").openCursor(); r.onsuccess = () => { const cur = r.result; if (!cur) return res(); const v = cur.value; urls.set(cur.key, URL.createObjectURL(v.blob)); meta.set(cur.key, { w: v.w, h: v.h, type: v.blob.type }); cur.continue(); }; r.onerror = () => res(); } catch (e) { res(); } });
      if (dbChinh) await docHet(dbChinh);
    },
    url: id => urls.get(id),
    meta: id => meta.get(id),
    has: id => urls.has(id),
    /* Lưu ảnh, trả về mã. Trùng ảnh thì dùng lại mã cũ. */
    async put(blob) {
      const s = await shrink(blob); if (!s) return null;
      const bytes = new Uint8Array(await s.blob.arrayBuffer()), id = "i" + await hash(bytes);
      if (!urls.has(id)) { urls.set(id, URL.createObjectURL(s.blob)); meta.set(id, { w: s.w, h: s.h, type: s.blob.type }); await tx("readwrite", st => st.put({ blob: s.blob, w: s.w, h: s.h }, id)); }
      return id;
    },
    /* Lưu ảnh với mã có sẵn (khi lấy lại từ thư mục dữ liệu) */
    async putRaw(id, blob) {
      if (urls.has(id)) return id; const d = await dims(blob); if (!d) return null; URL.revokeObjectURL(d.u);
      urls.set(id, URL.createObjectURL(blob)); meta.set(id, { w: d.w, h: d.h, type: blob.type }); await tx("readwrite", st => st.put({ blob, w: d.w, h: d.h }, id)); return id;
    },
    async blob(id) {
      const v = await tx("readonly", st => st.get(id)); if (v) return v.blob;
      if (!dbChinh) return null;  // bản thử: tìm tiếp trong kho hình bản chính (chỉ đọc)
      return new Promise(res => { try { const q = dbChinh.transaction("img").objectStore("img").get(id); q.onsuccess = () => res(q.result ? q.result.blob : null); q.onerror = () => res(null); } catch (e) { res(null); } });
    },
    async toDataURL(id) { const b = await this.blob(id); if (!b) return null; return new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); }); },
    async fromDataURL(id, dataUrl) { if (urls.has(id)) return id; const b = await (await fetch(dataUrl)).blob(); const nid = await this.put(b); if (nid !== id) { urls.set(id, urls.get(nid)); meta.set(id, meta.get(nid)); await tx("readwrite", st => st.put({ blob: b, w: meta.get(nid).w, h: meta.get(nid).h }, id)); } return id; },
    idsIn: text => [...String(text || "").matchAll(/!\[[^\]]*\]\(img:([\w-]+)\)/g)].map(m => m[1])
  };
})();
/* Tải file xuống máy */

/* ---------- Lớp học ---------- */

/* Mỗi dòng: "Họ tên" hoặc "Họ tên, nhãn" (nhãn: giới tính, học lực…). Bỏ số thứ tự đầu dòng. */
App.roster = c => {
  const seen = new Set(), out = [];
  for (let line of String(c.raw || "").split(/\r?\n/)) {
    line = line.replace(/^[\s\d.)\-–]+(?=\D)/, "");
    const cols = line.split(/[,;\t|]/).map(s => s.trim());
    const name = cols[0]; if (!name || seen.has(name)) continue;
    seen.add(name); out.push({ name, tag: cols[1] || "" });
  }
  return out;
};

/* Đổi môn: chọn luôn một bộ câu hỏi của môn đó (nếu có) */
App.pickSetForSubject = () => { const cur = App.set(); if (cur && (cur.subject || "chung") === S.subject) return cur; const f = App.setsOf(S.subject)[0]; if (f) S.curSet = f.id; return f || null; };
App.touchSet = st => { st.updatedAt = Date.now(); };
App.newSet = (name, raw) => { const s = { id: App.uid("s"), name: name || "Bộ câu hỏi mới", subject: S.subject, raw: raw ?? "# Bộ câu hỏi mới\n\nCâu 1. [NB] Câu hỏi đầu tiên\n*A. Đáp án đúng\nB. Đáp án sai\nC. Đáp án sai\nD. Đáp án sai\n", used: [] }; S.sets.push(s); S.curSet = s.id; App.save(); return s; };
/*
  Định dạng câu hỏi: dùng chung quy ước của OLM, thêm vài ký hiệu gõ nhanh.
    Câu 1. [NB] Nội dung câu hỏi      (hoặc "? Nội dung")      [NB] [TH] [VD]: mức độ
    *A. Đáp án đúng   B. Đáp án sai    (hoặc "* đúng", "- sai")   # sau chữ cái: giữ nguyên vị trí
    Câu 2. [TF] Câu đúng/sai 4 ý, dấu * trước các ý đúng
    Trả lời: [[2,8]]                   trả lời ngắn (hoặc "= 2,8"; "= Đúng" cho câu đúng/sai 1 ý)
    Lời giải                           các dòng sau là lời giải (hoặc "! giải thích")
    [DIV][FIX] đoạn dẫn chung ... [ONE] câu chùm
    Thuật ngữ :: Nghĩa                 cặp ghép cho Lật thẻ
    $\frac{p}{T}$ công thức   ![](img:mã) hình   m/s^2, H_2O viết gọn
    \ ở đầu dòng: dòng chữ thường, không phải ký hiệu
*/
App.LEVELS = { NB: "Nhận biết", TH: "Thông hiểu", VD: "Vận dụng", VDC: "Vận dụng cao" };
App.parseSet = raw => {
  const items = [], errors = [], warnings = [], clusters = {};
  let title = "", cur = null, cluster = null, seq = 0, mode = null;
  const cleanRef = s => s.replace(/(câu\s*)?\[\d+p\](\s*(và|,|–|-)\s*(câu\s*)?\[\d+p\])*/gi, "các câu sau");
  const close = () => {
    if (!cur) return;
    const q = cur, base = { q: q.text.trim(), explain: q.explain.trim(), line: q.line, level: q.level, cluster: q.cluster };
    if (!base.q && !q.options.length) { cur = null; return; }
    const nc = q.options.filter(o => o.ok).length;
    if (q.tf4 || (nc > 1 && q.options.length >= 3)) {
      if (!q.tf4) warnings.push({ line: q.line, msg: "Có nhiều phương án đúng nên được hiểu là câu Đúng/Sai nhiều ý. Thêm [TF] để ghi rõ." });
      if (q.options.length < 2) errors.push({ line: q.line, msg: "Câu đúng/sai cần các ý a, b, c, d." });
      else items.push({ ...base, type: "tf4", statements: q.options.map(o => o.t), truth: q.options.map(o => o.ok), fixed: q.options.map(o => o.fix) });
    } else if (q.options.length) {
      if (q.options.length < 2) errors.push({ line: q.line, msg: "Câu trắc nghiệm cần ít nhất 2 phương án." });
      else if (nc === 0) errors.push({ line: q.line, msg: "Chưa đánh dấu đáp án đúng (gạch chân trong Word, hoặc thêm * trước chữ cái đúng)." });
      else items.push({ ...base, type: "mc", options: q.options.map(o => o.t), fixed: q.options.map(o => o.fix), correct: q.options.findIndex(o => o.ok) });
    } else if (q.answer != null) {
      const a = q.answer.trim(), low = a.toLowerCase();
      if (low === "đúng" || low === "sai") items.push({ ...base, type: "tf", options: ["Đúng", "Sai"], fixed: [true, true], correct: low === "đúng" ? 0 : 1 });
      else items.push({ ...base, type: "short", answer: a });
    } else items.push({ ...base, type: "open" });
    cur = null; mode = null;
  };
  const append = (s) => {
    if (mode === "explain") { cur.explain += (cur.explain ? "\n" : "") + s; return true; }
    if (cur) { if (cur.options.length) { const o = cur.options[cur.options.length - 1]; o.t += "\n" + s; } else cur.text += (cur.text ? "\n" : "") + s; return true; }
    if (cluster) { cluster.passage += (cluster.passage ? "\n" : "") + cleanRef(s); return true; }
    return false;
  };
  const addOption = (label, okMark, text) => {
    let t = text.trim(), fix = false;
    if (t.startsWith("#")) { fix = true; t = t.slice(1).trim(); }
    cur.options.push({ t, ok: okMark, fix });
  };
  String(raw || "").split(/\r?\n/).forEach((l, i) => {
    const line = i + 1; let s = l.trim(), m;
    if (!s) { if (cur && mode !== "explain") close(); return; }
    if (s.startsWith("\\")) { if (!append(s.slice(1))) errors.push({ line, msg: "Dòng chữ này không thuộc câu hỏi nào." }); return; }
    // thẻ điều khiển của OLM ở đầu dòng
    while ((m = s.match(/^\[(ONE|DIV|FIX)\]\s*/i))) {
      const tag = m[1].toUpperCase(); s = s.slice(m[0].length);
      if (tag === "DIV") { close(); cluster = { id: "k" + (++seq), passage: "", fix: false, line }; clusters[cluster.id] = cluster; }
      else if (tag === "FIX") { if (cluster) cluster.fix = true; }
      else { close(); cluster = null; }
    }
    if (!s) return;
    if (s.startsWith("#") && !cur && !cluster) { if (!title) title = s.replace(/^#+\s*/, ""); return; }
    if ((m = s.match(/^(?:\?|câu\s*\d+\s*[:.)]|\d+\s*[.)](?=\s|\[))\s*(.*)$/i))) {
      close(); let text = m[1], ans = null, level = null, tf4 = false, t;
      while ((t = text.match(/^\[(NB|TH|VDC|VD|TF)\]\s*/i))) { const k = t[1].toUpperCase(); if (k === "TF") tf4 = true; else level = k; text = text.slice(t[0].length); }
      const sp = text.split("||"); if (sp.length > 1) { text = sp[0].trim(); ans = sp.slice(1).join("||").trim(); }
      const b = text.match(/\[\[(.*?)\]\]/); if (b) { ans = b[1].trim(); text = text.replace(b[0], "").trim(); }
      cur = { text, options: [], answer: ans, explain: "", line, level, tf4, cluster: cluster ? cluster.id : null }; mode = "q";
      if (cluster && cluster.fix === false && cluster.passage === "") warnings.push({ line, msg: "Câu chùm chưa có đoạn dẫn chung." });
      return;
    }
    if ((m = s.match(/^lời giải\s*[:.]?\s*(.*)$/i)) && cur) { mode = "explain"; if (m[1]) cur.explain += (cur.explain ? "\n" : "") + m[1]; return; }
    if ((m = s.match(/\[\[(.*?)\]\]/)) && cur && mode !== "explain") { cur.answer = m[1].trim(); return; }
    if ((m = s.match(/^(.+?)\s*::\s*(.+)$/)) && !cur && !cluster) { items.push({ type: "pair", a: m[1].trim(), b: m[2].trim(), line }); return; }
    if (!cur) { if (!append(s)) errors.push({ line, msg: "Không hiểu dòng này. Câu hỏi bắt đầu bằng \"Câu 1.\" hoặc dấu ?, cặp ghép viết dạng A :: B." }); return; }
    if (mode === "explain") { append(s); return; }
    if ((m = s.match(/^(\*?)\s*([A-Fa-f])\s*[.)]\s*(.*)$/))) {
      // nhiều phương án trên một dòng: "A. x   B. y   C. z   D. w"
      const parts = (m[1] + m[2] + ". " + m[3]).split(/\s+(?=\*?[B-F]\.\s)/);
      if (parts.length > 1 && m[2].toUpperCase() === "A") parts.forEach(p => { const k = p.match(/^(\*?)\s*([A-F])\.\s*(.*)$/); if (k) addOption(k[2], !!k[1], k[3]); });
      else addOption(m[2], !!m[1], m[3]);
      return;
    }
    if ((m = s.match(/^([*\-+])\s+(.*)$/)) || (m = s.match(/^([*\-+])(\S.*)$/))) { addOption("", m[1] === "*", m[2]); return; }
    if ((m = s.match(/^=\s*(.*)$/))) { cur.answer = m[1]; return; }
    if ((m = s.match(/^!\s*(.*)$/))) { cur.explain += (cur.explain ? "\n" : "") + m[1]; return; }
    append(s);
  });
  close();
  const count = t => items.filter(x => t.includes(x.type)).length;
  return { title, items, errors, warnings, clusters, nQ: count(["mc", "tf", "tf4", "short", "open"]), nMC: count(["mc", "tf"]), nTF4: count(["tf4"]), nShort: count(["short"]), nPair: count(["pair"]) };
};
App.parsed = () => App.parseSet(App.set().raw);
/* Cặp thẻ: ưu tiên cặp ghép; có thể lấy thêm câu hỏi → đáp án */
App.pairsOf = (p, includeQ) => {
  const out = p.items.filter(x => x.type === "pair").map(x => ({ a: x.a, b: x.b }));
  if (includeQ || !out.length) p.items.forEach(x => {
    if (x.type === "mc" || x.type === "tf") out.push({ a: x.q, b: x.options[x.correct] });
    else if (x.type === "short") out.push({ a: x.q, b: x.answer });
  });
  return out;
};
/* Đáp án dạng chữ để hiện nhanh */
App.answerText = x => x.type === "tf4" ? x.statements.map((s, i) => `${"abcdef"[i]}) ${x.truth[i] ? "Đúng" : "Sai"}`).join(", ") : x.options ? x.options[x.correct] : (x.answer || "");

/* ---------- Đội chơi dùng chung (lấy từ lần chia nhóm gần nhất nếu có) ---------- */
App.lastGroups = () => (S.groups || {})[App.cls().id] || null;

  const names = App.SUBJECTS[S.subject].teams;

/* ---------- Gọi đại diện trong một đội ----------
   Không gọi lại bạn đã được gọi trong đội cho đến khi cả đội đều đã lên; bỏ qua bạn vắng. */
App.callFromTeam = (gi, members) => {
  const abs = new Set(App.cls().absent), pool = (members || []).filter(n => !abs.has(n));
  if (!pool.length) return null;
  const L = App.lastGroups(), store = L ? (L.called = L.called || {}) : (App._called = App._called || {});
  let used = (store[gi] || []).filter(n => pool.includes(n)), avail = pool.filter(n => !used.includes(n));
  if (!avail.length) { used = []; avail = pool; }
  const pick = avail[App.rnd(avail.length)]; used.push(pick); store[gi] = used; App.save();
  return pick;
};
/* Hiệu ứng xoay tên rồi dừng ở người được chọn. show(text, final) được gọi mỗi nhịp. */
App.rollName = (pool, final, show, done, delay = 0) => {
  if (App.reduce || pool.length < 2) { setTimeout(() => { show(final, true); done && done(); }, delay); return; }
  let n = 0; const steps = 12;
  const tick = () => { if (++n >= steps) { show(final, true); done && done(); return; } show(pool[App.rnd(pool.length)], false); App.sound.tick("click"); setTimeout(tick, 45 + n * 14); };
  setTimeout(tick, delay);
};

/* ---------- Âm thanh tự tạo (không cần file, chạy offline) ---------- */
let AC, master, noiseBuf;
App.ac = () => {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.connect(AC.destination); } catch (e) { } }
  if (AC && master) master.gain.value = S.prefs.volume / 100;
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
};

/* =========================================================

   Học từ cách các app web như Excalidraw, VS Code bản web giữ "tệp đã liên kết":
   chọn thư mục một lần, tự ghi khi có thay đổi, mở lại app thì xin phép bằng một cú bấm.
   Cấu trúc ghi ra:
     DuLieu/du-lieu.json               toàn bộ lớp, bộ câu hỏi, điểm, cài đặt
     DuLieu/hinh/<mã>.png|jpg          hình dùng trong bộ câu hỏi
     DuLieu/bo-cau-hoi/<tên>.lopvui    từng bộ câu hỏi kèm hình, để gửi đồng nghiệp

"use strict";
(function () {

// Bản thử KHÔNG BAO GIỜ nối thư mục LopVui (tránh ghi đè dữ liệu thật): coi như máy không hỗ trợ
const supported = () => !App.THU && typeof window.showDirectoryPicker === "function" && window.self === window.top;

/* --- lưu "tay cầm" thư mục để lần sau mở app không phải chọn lại --- */
const idb = (mode, fn) => new Promise(res => {
  try { const r = indexedDB.open("lopvui-fs", 1); r.onupgradeneeded = () => r.result.createObjectStore("h"); r.onerror = () => res(null);
    r.onsuccess = () => { try { const t = r.result.transaction("h", mode), q = fn(t.objectStore("h")); t.oncomplete = () => res(q && q.result); t.onerror = () => res(null); } catch (e) { res(null); } }; }

const getHandle = () => idb("readonly", s => s.get("dir"));
const putHandle = h => idb("readwrite", s => s.put(h, "dir"));

async function writeFile(d, name, data) { const fh = await d.getFileHandle(name, { create: true }); const w = await fh.createWritable(); await w.write(data); await w.close(); }

function emit() { listeners.forEach(f => { try { f(); } catch (e) { } }); }

async function flush() {
  if (!sub || state !== "on") return;
  if (writing) { pending = true; return; }
  writing = true;
  try {
    const json = JSON.stringify(S);
    await writeFile(sub, "du-lieu.json", json);
    // bản đầu ngày: ghi một lần mỗi ngày, giữ 30 bản gần nhất
    const bk = await sub.getDirectoryHandle("sao-luu", { create: true }), day = new Date().toISOString().slice(0, 10), bname = `du-lieu-${day}.json`;
    if (!(await has(bk, bname))) {
      await writeFile(bk, bname, json);
      const names = []; for await (const [n] of bk.entries()) if (/^du-lieu-\d{4}-\d{2}-\d{2}\.json$/.test(n)) names.push(n);
      names.sort().slice(0, Math.max(0, names.length - 30)).forEach(n => bk.removeEntry(n).catch(() => { }));
    }
    // hình
    const hd = await sub.getDirectoryHandle("hinh", { create: true });
    const ids = S.sets.flatMap(st => App.img.idsIn(st.raw)); if (S.prefs.bg && S.prefs.bg.img) ids.push(S.prefs.bg.img);
    for (const id of ids) {
      if (doneImg.has(id)) continue;
      const m = App.img.meta(id), name = id + extOf(m && m.type);
      if (!(await has(hd, name))) { const b = await App.img.blob(id); if (b) await writeFile(hd, name, b); }
      doneImg.add(id);
    }
    // từng bộ câu hỏi thành file .lopvui; đổi tên hoặc xóa bộ thì dọn file cũ do app tạo
    const sd = await sub.getDirectoryHandle("bo-cau-hoi", { create: true });
    S.fsNames = S.fsNames || {};
    const used = new Set();
    for (const st of S.sets) {
      let fname = safe(st.name) + ".lopvui"; if (used.has(fname)) fname = safe(st.name) + " (" + st.id.slice(-4) + ").lopvui"; used.add(fname);
      const old = S.fsNames[st.id];
      if (old && old !== fname) await sd.removeEntry(old).catch(() => { });
      if (setSig[st.id] !== sig(st) || old !== fname) { await writeFile(sd, fname, await App.docx.exportSet(st)); setSig[st.id] = sig(st); }
      S.fsNames[st.id] = fname;
    }
    for (const [id, f] of Object.entries(S.fsNames)) if (!S.sets.some(s => s.id === id)) { await sd.removeEntry(f).catch(() => { }); delete S.fsNames[id]; }

    console.error(e);
    if (e && (e.name === "NotAllowedError" || e.name === "SecurityError")) setState("need", "Trình duyệt cần thầy cô cho phép lại.");
    else if (e && e.name === "NotFoundError") setState("error", "Không tìm thấy thư mục. Có thể đã bị đổi tên hoặc xóa.");

/* Dùng một thư mục; nếu trong đó đã có dữ liệu mới hơn thì trả về để giao diện hỏi */
async function use(h) {
  dir = h;
  sub = h.name === "DuLieu" ? h : await h.getDirectoryHandle("DuLieu", { create: true });
  await putHandle(h);
  const f = await readFile(sub, "du-lieu.json");
  if (f) {
    try {
      const d = JSON.parse(await f.text());
      if (d && Array.isArray(d.classes) && (S.fresh || (d.savedAt || 0) > (S.savedAt || 0) + 1000)) { setState("conflict"); return { conflict: d }; }
    } catch (e) { }
  }
  doneImg.clear(); Object.keys(setSig).forEach(k => delete setSig[k]);
  setState("on"); await flush(); return {};
}
/* Lấy dữ liệu trong thư mục về app (khi thư mục có bản mới hơn, hoặc chuyển sang máy khác) */
async function loadFromFolder(d) {
  const hd = await sub.getDirectoryHandle("hinh", { create: true });
  for await (const [name, fh] of hd.entries()) {
    if (fh.kind !== "file") continue;
    const id = name.replace(/\.[a-z]+$/i, ""); if (App.img.has(id)) continue;
    await App.img.putRaw(id, await fh.getFile());
  }
  App.importData(JSON.stringify(d));
  doneImg.clear(); Object.keys(setSig).forEach(k => delete setSig[k]);
  setState("on"); await flush();
}
async function keepLocal() { delete S.fresh; doneImg.clear(); setState("on"); S.savedAt = Date.now(); await flush(); }

/* Các bản sao lưu trong DuLieu/sao-luu: bản đầu mỗi ngày + bản tự lưu ngay trước mỗi lần khôi phục */

  if (!sub || state !== "on") return [];
  const bk = await sub.getDirectoryHandle("sao-luu", { create: true }), out = [];
  for await (const [name, fh] of bk.entries()) {
    if (fh.kind !== "file" || !/\.json$/i.test(name)) continue;

      if (!d || !Array.isArray(d.classes)) continue;
      out.push({ name, names: d.classes.map(c => c.name).slice(0, 4).join(", ") + (d.classes.length > 4 ? "…" : ""), before: name.startsWith("truoc-khoi-phuc"), savedAt: d.savedAt || f.lastModified, classes: d.classes.length, students: d.classes.reduce((a, c) => a + String(c.raw || "").split(/\r?\n/).filter(l => l.trim()).length, 0), sets: (d.sets || []).length, scores: d.classes.reduce((a, c) => a + Object.values(c.scores || {}).reduce((x, y) => x + y, 0), 0) });
    } catch (e) { }
  }

}

  const bk = await sub.getDirectoryHandle("sao-luu"), f = await (await bk.getFileHandle(name)).getFile(), txt = await f.text();
  const stamp = new Date(Date.now() + 7 * 36e5).toISOString().slice(0, 16).replace("T", "-").replace(":", "h");
  await writeFile(bk, `truoc-khoi-phuc-${stamp}.json`, JSON.stringify(S)); // giữ bản hiện tại để có thể quay lại

App.fs = {

  get state() { return state; }, get folder() { return dir ? dir.name : ""; }, get lastSaved() { return lastSaved; }, get error() { return lastErr; },
  onChange: f => listeners.push(f),
  async choose() {
    if (!supported()) throw new Error(App.THU ? "Bản thử không lưu ra thư mục (để không đụng dữ liệu thật)." : "Trình duyệt này không hỗ trợ lưu vào thư mục.");
    const h = await window.showDirectoryPicker({ id: "lopvui", mode: "readwrite", startIn: "documents" });
    return use(h);
  },
  /* Mở lại app: thử dùng thư mục cũ; trình duyệt thường bắt bấm "Cho phép" lại */
  async init() {

  },

/* Mỗi lần app lưu vào trình duyệt thì hẹn ghi ra thư mục */

})();

const neonWaves = svgUrl(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 260' preserveAspectRatio='none'><path d='M0 150 C240 90 480 210 720 150 S1200 90 1440 150' fill='none' stroke='rgba(56,214,255,0.35)' stroke-width='2'/><path d='M0 195 C260 145 520 245 780 195 S1240 155 1440 200' fill='none' stroke='rgba(255,95,168,0.28)' stroke-width='2'/><path d='M0 230 C300 205 600 255 900 228 S1300 215 1440 236' fill='none' stroke='rgba(56,214,255,0.22)' stroke-width='2'/></svg>`);
const NEON_BG = `${neonWaves} center bottom / 100% 30vh no-repeat fixed, linear-gradient(rgba(56,214,255,.05) 1px, transparent 1px) 0 0 / 44px 44px, linear-gradient(90deg, rgba(56,214,255,.05) 1px, transparent 1px) 0 0 / 44px 44px, radial-gradient(1000px 520px at 50% -10%, #17385A 0%, transparent 65%), radial-gradient(700px 420px at 100% 100%, #2A1240 0%, transparent 60%), #070F1A`;
const lum = hex => { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ""); if (!m) return 1; const n = parseInt(m[1], 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
App.bg = () => Object.assign({ kind: "preset", id: "sea", color: "#DCEFF5", img: "", dim: 55, tone: "auto" }, S.prefs.bg || {});

};
/* Ảnh nền: lưu vào kho hình, đoán chữ sáng/tối theo độ sáng trung bình của ảnh */
App.setBgImage = async file => {
  const id = await App.img.put(file); if (!id) throw new Error("Không đọc được ảnh.");
  let autoTone = "light";

    const im = new Image(); im.src = App.img.url(id); await im.decode();
    const c = document.createElement("canvas"); c.width = 32; c.height = 32; const x = c.getContext("2d"); x.drawImage(im, 0, 0, 32, 32);
    const d = x.getImageData(0, 0, 32, 32).data; let s = 0; for (let i = 0; i < d.length; i += 4) s += .2126 * d[i] + .7152 * d[i + 1] + .0722 * d[i + 2];

})();

/* ===== src/bank.js ===== */
/* =========================================================
   KHO CÂU HỎI SOẠN SẴN theo SGK Kết nối tri thức (chương trình GDPT 2018), lớp 10–12.
   Mỗi "gói" là một môn của một khối, viết bằng chữ theo quy ước OLM, chia chương/bài bằng dòng @:
     @goi ly10 | ly | 10 | Vật lí 10 | Kết nối tri thức
     @chuong I | Mở đầu
     @bai 1 | Làm quen với vật lí
     Câu 1. [NB] ...           (câu hỏi soạn như bộ câu hỏi thường)
   Gói có sẵn được ghép vào app lúc build (thư mục data/kho); gói mới nhập từ file được lưu trong S.bankPacks.
   Giáo viên không duyệt từng câu: xem trước cả bộ, ẩn câu không hợp (S.bankHidden), báo lỗi (S.bankReports).
   ========================================================= */
"use strict";
(function () {
const S = App.S;
S.bankHidden = S.bankHidden || {}; S.bankReports = S.bankReports || []; S.bankPacks = S.bankPacks || []; S.bankSel = S.bankSel || {};
/* Giáo viên sửa câu trong kho: lưu bản sửa theo mã câu gốc (kho cập nhật thì câu khác vẫn nhận bản mới).
   Câu tự thêm vào một bài: S.bankMine[mãBài] = [{ id, raw }] */
S.bankEdits = S.bankEdits || {}; S.bankMine = S.bankMine || {};
const hash = s => { let h = 5381; for (const c of String(s)) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0; return h.toString(36); };
const norm = s => String(s || "").replace(/\s+/g, " ").trim();
const packs = new Map();

function parsePack(text, source) {
  let pack = null, ch = null, ls = null;
  for (const line of String(text).replace(/\r/g, "").split("\n")) {
    let m;
    if ((m = /^@goi\s+(.+)$/i.exec(line))) { const [id, subject, grade, name, book] = m[1].split("|").map(s => s.trim()); pack = { id, subject, grade: +grade, name, book: book || "", source, chapters: [] }; continue; }
    if (!pack) continue;
    if ((m = /^@chuong\s+(.+)$/i.exec(line))) { const [no, name] = m[1].split("|").map(s => s.trim()); ch = { no, name, lessons: [] }; pack.chapters.push(ch); ls = null; continue; }
    if ((m = /^@bai\s+(.+)$/i.exec(line))) { if (!ch) { ch = { no: "", name: "", lessons: [] }; pack.chapters.push(ch); } const [no, name] = m[1].split("|").map(s => s.trim()); ls = { id: pack.id + "-b" + no, no, name, chapter: ch, pack, lines: [], qs: null }; ch.lessons.push(ls); continue; }
    if (ls) ls.lines.push(line);
  }
  if (!pack || !pack.id || !pack.subject) throw new Error("File không phải gói câu hỏi của Lớp Vui (thiếu dòng @goi).");
  return pack;
}
/* Tách bài thành từng câu (mỗi câu bắt đầu bằng "Câu n."), đọc dạng và mức độ bằng bộ đọc câu hỏi chung */
const KIND = { mc: "tn", tf: "tn", tf4: "ds", short: "tln", open: "mo" };
function questions(ls) {
  if (ls.qs) return ls.qs;
  const blocks = []; let cur = null;
  for (const l of ls.lines) { if (/^\s*Câu\s*\d+\s*[.:]/i.test(l)) { cur = [l]; blocks.push(cur); } else if (cur) cur.push(l); }
  ls.qs = blocks.map(b => mkQ(b.join("\n").trim(), ls)).filter(Boolean);
  return ls.qs;
}
function mkQ(raw, ls, key) {
  const p = App.parseSet(raw), it = p.items.find(x => KIND[x.type]);
  if (!it) return null;
  return { key: key || ls.id + "#" + hash(norm(it.q)), raw, item: it, kind: KIND[it.type], level: it.level || "", lesson: ls, errors: p.errors };
}
/* Danh sách câu thầy cô thấy: câu gốc (hoặc bản đã sửa) + câu tự thêm */
function view(ls) {
  const base = questions(ls).map(q => { const e = S.bankEdits[q.key]; if (!e) return q; const v = mkQ(e, ls, q.key); return v ? { ...v, edited: true } : q; });
  const mine = (S.bankMine[ls.id] || []).map(m => { const v = mkQ(m.raw, ls, ls.id + "#my-" + m.id); return v ? { ...v, mine: true, mid: m.id } : null; }).filter(Boolean);
  return base.concat(mine);
}
/* Kiểm tra một câu thầy cô gõ: phải ra đúng một câu hỏi hợp lệ */
function validate(raw) {
  raw = String(raw || "").trim(); if (!/^\s*Câu\s*\d+\s*[.:]/i.test(raw)) raw = "Câu 1. " + raw;
  const p = App.parseSet(raw), qs = p.items.filter(x => KIND[x.type]);
  if (p.errors.length) return { ok: false, msg: p.errors.map(e => e.msg).join(" ") };
  if (qs.length !== 1) return { ok: false, msg: qs.length ? "Mỗi lần chỉ lưu một câu. Hãy tách thành từng câu riêng." : "Chưa đọc được câu hỏi. Xem lại mẫu bên dưới." };
  return { ok: true, raw };
}
function add(text, source) { const p = parsePack(text, source); packs.set(p.id, p); return p; }

App.bank = {
  KINDS: { tn: "Trắc nghiệm", ds: "Đúng/Sai 4 ý", tln: "Trả lời ngắn", mo: "Câu hỏi mở" },
  add, questions, view, validate,
  saveEdit(key, raw) { const v = validate(raw); if (!v.ok) return v; S.bankEdits[key] = v.raw; App.save(); return v; },
  resetEdit(key) { delete S.bankEdits[key]; App.save(); },
  addMine(lsId, raw) { const v = validate(raw); if (!v.ok) return v; (S.bankMine[lsId] = S.bankMine[lsId] || []).push({ id: App.uid("q"), raw: v.raw }); App.save(); return v; },
  updateMine(lsId, mid, raw) { const v = validate(raw); if (!v.ok) return v; const m = (S.bankMine[lsId] || []).find(x => x.id === mid); if (m) m.raw = v.raw; App.save(); return v; },
  delMine(lsId, mid) { S.bankMine[lsId] = (S.bankMine[lsId] || []).filter(x => x.id !== mid); if (!S.bankMine[lsId].length) delete S.bankMine[lsId]; App.save(); },
  init() {
    (App.BANK_BUILTIN || []).forEach(t => { try { add(t, "builtin"); } catch (e) { console.error(e); } });
    S.bankPacks.forEach(t => { try { add(t, "imported"); } catch (e) { console.error(e); } });
    // Bản web: gói nằm ở kho/*.txt, tải về một lần rồi trình duyệt giữ sẵn để dùng khi mất mạng
    App.bank.ready = App.BANK_BUILTIN || !/^https?:/.test(location.protocol) ? Promise.resolve() :
      fetch("kho/index.json", { cache: "no-cache" }).then(r => r.json()).then(list => Promise.all(list.map(f => fetch("kho/" + f).then(r => r.ok ? r.text() : "").then(t => { if (t) try { add(t, "builtin"); } catch (e) { console.error(e); } }))))
        .then(() => { S.bankPacks.forEach(t => { try { add(t, "imported"); } catch (e) { } }); App.refreshIfIdle && App.refreshIfIdle(); })
        .catch(e => console.warn("Không tải được kho câu hỏi", e));
  },
  packs: () => [...packs.values()],
  forSubject: subj => [...packs.values()].filter(p => p.subject === subj).sort((a, b) => a.grade - b.grade),
  pack: id => packs.get(id),
  lesson(id) { for (const p of packs.values()) for (const c of p.chapters) for (const l of c.lessons) if (l.id === id) return l; return null; },
  count: ls => view(ls).length,
  hidden: key => !!S.bankHidden[key],
  setHidden(key, on) { if (on) S.bankHidden[key] = 1; else delete S.bankHidden[key]; App.save(); },
  /* Nhập gói từ file: thay gói cùng mã (bản cập nhật), giữ các câu đã ẩn */
  importText(text) {
    const p = parsePack(text, "imported");
    const i = S.bankPacks.findIndex(t => { try { return parsePack(t).id === p.id; } catch (e) { return false; } });
    if (i >= 0) S.bankPacks[i] = text; else S.bankPacks.push(text);
    packs.set(p.id, p); App.save(); return p;
  },
  /* Ghép các câu thành chữ của một bộ câu hỏi, đánh số lại từ 1 */
  toRaw(list, title) { return (title ? `# ${title}\n\n` : "") + list.map((q, i) => q.raw.replace(/^\s*Câu\s*\d+\s*[.:]/i, `Câu ${i + 1}.`)).join("\n\n") + "\n"; },
  /* Dùng các câu đã chọn cho trò chơi: mỗi môn có một bộ "Từ Kho" dùng lại, không sinh thêm bộ mới mỗi lần */
  useInGames(subject, list, name) {
    let st = S.sets.find(s => s.bank && s.subject === subject);
    if (!st) { st = { id: App.uid("s"), subject, bank: true, used: [] }; S.sets.push(st); }
    st.name = name; st.raw = App.bank.toRaw(list, name); st.used = []; st.bankKeys = {}; list.forEach(q => st.bankKeys[norm(q.item.q)] = q.key);
    App.touchSet(st); S.curSet = st.id; App.save(); return st;
  },
  /* Câu hỏi đang hiện trong trò chơi có phải lấy từ Kho không (để hiện nút Báo lỗi) */
  keyOf(qText) { const st = App.set(); return st && st.bankKeys ? st.bankKeys[norm(qText)] || null : null; },
  report(key, qText, note) {
    S.bankReports = S.bankReports.filter(r => r.key !== key);
    const ls = App.bank.lesson(String(key).split("#")[0]);
    S.bankReports.unshift({ key, q: norm(qText).slice(0, 400), note: norm(note).slice(0, 400), lesson: ls ? `${ls.pack.name} · Bài ${ls.no}. ${ls.name}` : "", t: Date.now() });
    App.save();
  },
  reported: key => S.bankReports.some(r => r.key === key),
  /* Ôn nhanh: lấy n câu cân đối dạng (TN : Đ/S : TLN ≈ 6 : 2 : 2) và trải đều mức độ NB → TH → VD */
  quick(pool, n = 10) {
    const by = k => App.shuffle(pool.filter(q => q.kind === k));
    const spread = arr => { const lv = { NB: [], TH: [], VD: [], "": [] }; arr.forEach(q => (lv[q.level] || lv[""]).push(q)); const out = []; while (out.length < arr.length) for (const k of ["NB", "TH", "VD", ""]) if (lv[k].length) out.push(lv[k].shift()); return out; };
    const want = { tn: Math.round(n * .6), ds: Math.round(n * .2), tln: n - Math.round(n * .6) - Math.round(n * .2) };
    const pick = { tn: spread(by("tn")).slice(0, want.tn), ds: by("ds").slice(0, want.ds), tln: spread(by("tln")).slice(0, want.tln) };
    let out = [...pick.tn, ...pick.ds, ...pick.tln];
    if (out.length < n) { const rest = App.shuffle(pool.filter(q => !out.includes(q))); out = out.concat(rest.slice(0, n - out.length)); }
    const order = { tn: 0, ds: 1, tln: 2, mo: 3 };
    return out.sort((a, b) => order[a.kind] - order[b.kind]);
  }
};
})();

(function () {

const { $, esc, S } = App;
const TAU = Math.PI * 2, TOP = 0; // kim đặt bên phải vòng (hướng 3 giờ) để tên ô trúng nằm ngang
let el, cfg, cv, ctx, wrap, stageEl, size = 0, rot = 0, spinning = false, winner = null, glowT = 0, glowRAF = 0, shrink = null, ro;
let current = null, currentQ = null, grade = null, timerId = 0, alive = false;

const G = {

/* ---- Danh sách trên vòng ---- */
const cls = () => App.cls();
const pool = () => { const c = cls(), pk = new Set(c.picked || []); return App.present(c).filter(n => !pk.has(n)); };
function stats() {
  const c = cls(), all = App.students(c).length, pres = App.present(c).length, left = pool().length;
  $("wStats").textContent = `${all} học sinh · ${all - pres} vắng · ${pres - left} đã gọi · còn ${left} trên vòng`;
  $("wRestore").disabled = !(c.picked || []).length;
}
function labels(names) {
  const mode = cfg.nameMode === "auto" ? (names.length > 14 ? "given" : "full") : cfg.nameMode;
  if (mode === "full") return names.slice();
  const parts = names.map(n => n.split(/\s+/)), given = parts.map(p => p[p.length - 1]), cnt = {};
  given.forEach(g => cnt[g] = (cnt[g] || 0) + 1);
  // trùng tên gọi → thêm tên đệm; vẫn trùng (Nguyễn Văn An, Trần Văn An) → họ + tên; vẫn trùng → họ và tên đầy đủ

  const out = given.slice();
  for (const t of tries) {
    const c2 = {}; out.forEach(x => c2[x] = (c2[x] || 0) + 1);
    let dup = false; out.forEach((x, i) => { if (c2[x] > 1 && parts[i].length > 1) { out[i] = null; dup = true; } });
    if (!dup) break;
    out.forEach((x, i) => { if (x === null) out[i] = t(parts[i]); });
  }
  return out;
}
const wheelNames = () => { const names = pool(); return shrink && !names.includes(shrink.name) ? App.students(cls()).filter(n => names.includes(n) || n === shrink.name) : names; };

/* ---- Vẽ ---- */
function fit() {
  if (!cv || !alive) return;
  if (wrap && stageEl) { // chỗ còn lại = chiều cao sân khấu trừ phần đầu và dòng gợi ý
    const cs = getComputedStyle(stageEl), padV = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom), padH = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight), gap = parseFloat(cs.rowGap) || 0;
    let used = 0, k = 0; for (const ch of stageEl.children) if (ch !== wrap && ch.offsetParent !== null) { used += ch.offsetHeight; k++; }
    const avail = Math.floor(Math.min(el.clientWidth - padH, el.clientHeight - padV - used - gap * k, 820));
    const w = Math.max(240, avail) + "px"; if (wrap.style.width !== w) wrap.style.width = w;
  }
  const r = cv.getBoundingClientRect(), d = Math.max(1, devicePixelRatio || 1); size = Math.round(r.width); if (!size) return; cv.width = size * d; cv.height = size * d; ctx.setTransform(d, 0, 0, d, 0, 0); draw(); }
function slicePal(n) { const p = App.SUBJECTS[S.subject].pal, out = []; for (let i = 0; i < n; i++) out.push(p[i % p.length]); if (n > 1 && n % p.length === 1) out[n - 1] = p[1]; return out; }
function draw() {
  if (!size || !alive) return;
  const names = wheelNames(), lab = labels(names), n = names.length, R = size / 2 - 8, cx = size / 2, cy = size / 2;
  ctx.clearRect(0, 0, size, size);
  const fg = App.css("--fg"), rim = App.css("--rim") || fg, surface = App.css("--surface"), body = App.css("--f-body"), disp = App.css("--f-display");
  ctx.beginPath(); ctx.arc(cx, cy, R + 5, 0, TAU); ctx.fillStyle = rim; ctx.fill();
  if (!n) { ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fillStyle = surface; ctx.fill(); ctx.fillStyle = App.css("--muted"); ctx.font = `500 ${size * .04}px ${body}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("Chưa có học sinh nào có mặt", cx, cy); return; }
  const w = names.map(nm => shrink && nm === shrink.name ? shrink.w : 1), tot = w.reduce((a, b) => a + b, 0), pal = slicePal(n);
  const fs = Math.max(10, Math.min(size * .055, TAU / Math.max(1, tot) * R * .42, 26 * size / 600));
  let a = rot; const wi = winner ? names.indexOf(winner) : -1;
  for (let i = 0; i < n; i++) {
    const seg = w[i] * TAU / tot, a0 = a, a1 = a + seg; a += seg; if (seg <= .0001) continue;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a1); ctx.closePath(); ctx.fillStyle = pal[i][0]; ctx.fill();
    if (n > 1) { ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.lineWidth = 1; ctx.stroke(); }
    if (wi >= 0 && i !== wi) { ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fill(); }
    if (w[i] > .35) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(a0 + seg / 2); ctx.fillStyle = pal[i][1]; ctx.font = `600 ${fs}px ${body}`; ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.globalAlpha = wi >= 0 && i !== wi ? .55 : Math.min(1, w[i]);
      let t = lab[i]; const maxW = R * .66; if (ctx.measureText(t).width > maxW) { while (t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1); t += "…"; }
      ctx.fillText(t, R - fs * .7, 0); ctx.restore();
    }
    if (i === wi) { const p = .5 + .5 * Math.sin(glowT / 180); ctx.save(); ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a1); ctx.closePath(); ctx.strokeStyle = "#FFD43B"; ctx.lineWidth = 4 + p * 4; ctx.shadowColor = "#FFD43B"; ctx.shadowBlur = 18 + p * 16; ctx.stroke(); ctx.restore(); }

  const hr = Math.max(34, size * .1);
  ctx.beginPath(); ctx.arc(cx, cy, hr + 5, 0, TAU); ctx.fillStyle = rim; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, hr, 0, TAU); ctx.fillStyle = surface; ctx.fill();
  ctx.fillStyle = fg; ctx.font = `700 ${hr * .42}px ${disp}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(spinning ? "…" : "QUAY", cx, cy + 1);
}
function glowLoop(t) { if (!alive) return; glowT = t; draw(); if (winner && !App.reduce) glowRAF = requestAnimationFrame(glowLoop); }

/* ---- Quay ---- */
const idxAt = (r, n) => Math.floor((((TOP - r) % TAU + TAU) % TAU) / (TAU / n)) % n;
function spin() {
  if (spinning || !$("wOv").hidden) return;
  const c = cls();

function build() {

  const allow = { NB: ["NB"], "NB+TH": ["NB", "TH"], "TH+VD": ["TH", "VD", "VDC"] }[cfg.levels];
  if (allow) list = list.filter(x => !x.level || allow.includes(x.level));
  const units = [];
  list.forEach(x => { const last = units[units.length - 1]; if (x.cluster && last && last[0].cluster === x.cluster) last.push(x); else units.push([x]); });
  let u = cfg.shuffleQ ? App.shuffle(units) : units;
  if (cfg.levels === "ladder") { const r = l => ({ NB: 0, TH: 1, VD: 2, VDC: 3 }[l] ?? 1); u = u.slice().sort((a, b) => r(a[0].level) - r(b[0].level)); }
  let out = u.flat(); if (cfg.count) out = out.slice(0, cfg.count);
  // trộn nhưng giữ nguyên các vị trí được đánh dấu # (fixed)
  const perm = (n, fixed) => { const free = [...Array(n).keys()].filter(i => !(fixed && fixed[i])), sh = cfg.shuffleA ? App.shuffle(free) : free, order = [...Array(n).keys()]; free.forEach((pos, k) => order[pos] = sh[k]); return order; };
  return out.map(q => {
    if (q.type === "mc") { const o = perm(q.options.length, q.fixed); return { ...q, options: o.map(i => q.options[i]), correct: o.indexOf(q.correct) }; }
    if (q.type === "tf4") { const o = perm(q.statements.length, q.fixed); return { ...q, statements: o.map(i => q.statements[i]), truth: o.map(i => q.truth[i]) }; }
    return { ...q };
  });

/* ---------- Tìm cặp ---------- */
function newGame() {
  rounds = Math.max(1, Math.ceil(deck.length / cfg.per)); round = 0;
  useGroups = cfg.teamTurns && cfg.useGroups && !!App.lastGroups();
  teams = cfg.teamTurns ? App.makeTeams(cfg.teamCount, useGroups) : null; turn = 0;
  el.innerHTML = `<div class="flip-stage">
    <div class="flip-top"><span class="stat">Ván <b id="fR"></b></span><span class="stat">Thời gian <b id="fT">0:00</b></span><span class="stat">Lượt lật <b id="fM">0</b></span><span class="stat">Còn <b id="fL"></b> cặp</span><button class="btn small" id="fRe">Xáo lại ván này</button></div>
    ${teams ? `<div class="row" id="fTeams" style="justify-content:center"></div>` : ""}
    <div class="board" id="fB"></div></div>
    <div class="overlay" id="fOv" hidden><div class="result"><div id="fMascot"></div><div class="who-label">Hoàn thành</div><div class="who" id="fDone" style="font-size:clamp(28px,5vw,48px)"></div><div class="congrats" id="fSum"></div>
      <div class="row" style="justify-content:center"><button class="btn big" id="fAgain">Chơi lại từ đầu</button><button class="btn primary big" id="fNext">Ván tiếp</button></div></div></div>`;
  $("fRe").onclick = () => deal();
  $("fAgain").onclick = () => { deck = App.shuffle(deck); newGame(); };
  $("fNext").onclick = () => { $("fOv").hidden = true; round = (round + 1) % rounds; if (round === 0) deck = App.shuffle(deck); deal(); };
  addEventListener("resize", layout);
  deal();
}
function deal() {
  clearInterval(tick); open = []; matched = 0; moves = 0; busy = false;
  let pairs = deck.slice(round * cfg.per, round * cfg.per + cfg.per);
  if (pairs.length < 2) pairs = deck.slice(0, Math.min(cfg.per, deck.length));
  cards = App.shuffle(pairs.flatMap((p, i) => [{ pid: i, text: p.a }, { pid: i, text: p.b }]));
  $("fR").textContent = `${round + 1}/${rounds}`; $("fM").textContent = 0; $("fL").textContent = pairs.length; $("fT").textContent = "0:00";
  $("fB").innerHTML = cards.map((c, i) => `<button class="card" data-i="${i}" aria-label="Thẻ ${i + 1}"><div class="in"><div class="b">${i + 1}</div><div class="f">${App.html(c.text)}</div></div></button>`).join("");
  $("fB").querySelectorAll(".card").forEach(b => b.onclick = () => pick(b));
  t0 = 0; renderTeams(); layout();
}
function layout() {
  const b = $("fB"); if (!b || !alive) return;
  const n = cards.length, stage = el.getBoundingClientRect(), w = Math.min(1100, stage.width - 32), h = stage.height - 140;
  let best = 4, bestSize = 0;
  for (let cols = 3; cols <= 8; cols++) { const rows = Math.ceil(n / cols), cw = (w - (cols - 1) * 12) / cols, ch = (h - (rows - 1) * 12) / rows, s = Math.min(cw, ch * 4 / 3); if (s > bestSize) { bestSize = s; best = cols; } }
  if (stage.width < 560) best = Math.min(best, 3);
  b.style.gridTemplateColumns = `repeat(${best},minmax(0,1fr))`; b.style.maxWidth = Math.max(300, Math.min(w, best * bestSize + (best - 1) * 12)) + "px";
}
function renderTeams() {
  if (!teams) return;
  const cur = teams[turn], canCall = cur.members.length > 0;
  if (canCall && !cur.rep) cur.rep = App.callFromTeam(turn, cur.members) || "";
  $("fTeams").innerHTML = teams.map((t, i) => `<span class="team ${i === turn ? "turn" : ""}" style="padding:6px 12px"><span class="dot" style="background:${t.color}"></span><span class="nm">${esc(t.name)}</span><span class="pts">${t.score}</span></span>`).join("") +
    (canCall ? `<span class="team called" style="padding:6px 12px">Lượt ${esc(cur.name)}: mời <b class="rep" style="margin-left:4px">${esc(cur.rep || "…")}</b><button class="btn small call" id="fRep" style="margin-left:6px">Đổi bạn</button></span>` : "");
  if (canCall) $("fRep").onclick = () => { cur.rep = ""; renderTeams(); App.sound.tick("pop"); };
}
function pick(b) {
  if (busy || b.classList.contains("up") || b.classList.contains("done")) return;
  if (!t0) { t0 = Date.now(); tick = setInterval(() => { if (!alive) return; const s = Math.floor((Date.now() - t0) / 1000); $("fT").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }, 500); }
  App.ac(); App.sound.flip(); b.classList.add("up"); open.push(b);
  if (open.length < 2) return;
  moves++; $("fM").textContent = moves;
  const [x, y] = open, cx = cards[+x.dataset.i], cy = cards[+y.dataset.i];
  if (cx.pid === cy.pid) {
    open = [];
    setTimeout(() => { x.classList.add("done"); y.classList.add("done"); x.classList.remove("up"); y.classList.remove("up"); }, 250);
    App.sound.right(); matched++; $("fL").textContent = cards.length / 2 - matched;
    if (teams) { teams[turn].score++; if (useGroups) { const L = App.lastGroups(); if (L && L.groups[turn]) { L.groups[turn].score++; App.save(); } } renderTeams(); }
    const r = y.getBoundingClientRect(); App.fx.burst(r.left + r.width / 2, r.top + r.height / 2, 24);
    if (matched === cards.length / 2) setTimeout(won, 700);
  } else {
    busy = true;
    setTimeout(() => { x.classList.add("bad"); y.classList.add("bad"); }, 350);
    setTimeout(() => { x.classList.remove("up", "bad"); y.classList.remove("up", "bad"); open = []; busy = false; if (teams) { teams[turn].rep = ""; turn = (turn + 1) % teams.length; renderTeams(); if (teams[turn].rep) App.say("Mời bạn " + teams[turn].rep); } }, 1100);
  }
}
function won() {
  if (!alive) return; clearInterval(tick);
  const s = Math.floor((Date.now() - t0) / 1000), time = `${Math.floor(s / 60)} phút ${s % 60} giây`;
  const lead = teams ? teams.slice().sort((a, b) => b.score - a.score)[0] : null;
  $("fDone").innerHTML = lead ? App.lettered(lead.name + " dẫn đầu!") : App.lettered("Tuyệt vời!");
  $("fMascot").innerHTML = App.mascot("cheer", 96);
  $("fSum").textContent = `Ván ${round + 1}/${rounds}: tìm đủ ${cards.length / 2} cặp trong ${time} với ${moves} lượt lật.`;
  $("fNext").textContent = round + 1 < rounds ? "Ván tiếp" : "Chơi lại bộ này";
  $("fOv").hidden = false; $("fNext").focus();
  App.sound.win("fanfare"); App.fx.celebrate(cfg.fx);
}

/* ---------- Thẻ học ---------- */
function cardsMode() {
  known = new Set(); fcIdx = 0; fcUp = false; onlyUnknown = false; reversed = false; fcList = deck.slice();
  el.innerHTML = `<div class="flip-stage" style="justify-content:center;gap:18px">
    <div class="flip-top"><span class="stat">Thẻ <b id="cI"></b></span><span class="stat">Đã thuộc <b id="cK"></b></span>
      <button class="btn small" id="cShuf">Trộn thẻ</button><button class="btn small" id="cRev" aria-pressed="false">Đảo mặt</button><button class="btn small" id="cOnly" aria-pressed="false">Chỉ ôn thẻ chưa thuộc</button></div>
    <button class="fc" id="cCard"><div class="in"><div class="f"><small>Mặt trước</small><span id="cA"></span></div><div class="b"><small>Mặt sau</small><span id="cB"></span></div></div></button>
    <div class="row" style="justify-content:center"><button class="btn big" id="cPrev">← Trước</button><button class="btn big" id="cNo">Chưa thuộc <span class="kbd">2</span></button><button class="btn good big" id="cYes">Đã thuộc <span class="kbd">1</span></button><button class="btn big" id="cNext">Sau →</button></div>
    <span class="note">Bấm vào thẻ hoặc nhấn <span class="kbd">Space</span> để lật · <span class="kbd">←</span> <span class="kbd">→</span> chuyển thẻ</span></div>`;
  $("cCard").onclick = flipFc; $("cPrev").onclick = () => navFc(-1); $("cNext").onclick = () => navFc(1);
  $("cYes").onclick = () => markFc(true); $("cNo").onclick = () => markFc(false);
  $("cShuf").onclick = () => { fcList = App.shuffle(fcList); fcIdx = 0; fcUp = false; showFc(); App.sound.flip(); };
  $("cRev").onclick = e => { reversed = !reversed; e.currentTarget.setAttribute("aria-pressed", reversed); fcUp = false; showFc(); };
  $("cOnly").onclick = e => { onlyUnknown = !onlyUnknown; e.currentTarget.setAttribute("aria-pressed", onlyUnknown); fcList = onlyUnknown ? deck.filter(p => !known.has(p.a)) : deck.slice(); fcIdx = 0; fcUp = false; if (!fcList.length) { App.toast("Đã thuộc hết! Hiện lại toàn bộ thẻ."); onlyUnknown = false; e.currentTarget.setAttribute("aria-pressed", false); fcList = deck.slice(); } showFc(); };
  showFc();
}
function showFc() {
  const p = fcList[fcIdx]; if (!p) return;
  $("cCard").classList.toggle("up", fcUp);
  setTimeout(() => { if (!alive) return; $("cA").innerHTML = App.html(reversed ? p.b : p.a); $("cB").innerHTML = App.html(reversed ? p.a : p.b); }, fcUp ? 0 : 120);
  $("cI").textContent = `${fcIdx + 1}/${fcList.length}`; $("cK").textContent = `${known.size}/${deck.length}`;
}
function flipFc() { fcUp = !fcUp; App.ac(); App.sound.flip(); $("cCard").classList.toggle("up", fcUp); }
function navFc(d) { if (!fcList.length) return; fcIdx = (fcIdx + d + fcList.length) % fcList.length; fcUp = false; showFc(); App.sound.flip(); }
function markFc(k) {
  const p = fcList[fcIdx]; if (!p) return;
  if (k) { known.add(p.a); App.sound.right(); } else { known.delete(p.a); App.sound.beep(440, .08); }
  if (known.size === deck.length) { App.sound.win("fanfare"); App.fx.celebrate(cfg.fx); App.toast("Đã thuộc toàn bộ thẻ trong bộ này!"); }
  navFc(1);
}
App.registerGame(G);
})();

const DAY = 864e5, ago = t => { const d = Math.floor((Date.now() - t) / DAY); return d <= 0 ? "hôm nay" : d + " ngày trước"; };

    <div class="section-title"><h2>Chuẩn bị tiết học</h2><span class="note">Chọn lớp và bộ câu hỏi một lần, mọi trò chơi đều dùng chung.</span></div>

  if ($("hBackupLater")) $("hBackupLater").onclick = () => { S.backupSnooze = Date.now(); App.save(); home(); };
  if ($("hMigrateNo")) $("hMigrateNo").onclick = () => { S.prefs.migrateSkip = true; delete S.fresh; App.save(); home(); };

  V().querySelectorAll(".gcard").forEach(b => b.onclick = () => {

    if (g.uses === "questions" && !App.setsOf(S.subject).length && hasBank) { App.toast("Chọn bài trong Kho câu hỏi rồi bấm Dùng cho trò chơi."); go("bank"); return; }

    if (why) { App.toast(why); if (g.uses === "class") go("classes"); else go("sets"); return; }

  });
}

/* Soạn một câu trong Kho: ô chữ theo quy ước OLM + xem trước trực tiếp + kiểm tra khi lưu */
const TPL = {
  tn: "Câu 1. [TH] Nội dung câu hỏi?\nA. Phương án A\n*B. Phương án đúng (có dấu * phía trước)\nC. Phương án C\nD. Phương án D\nLời giải\nGiải thích ngắn (có thể bỏ).",
  ds: "Câu 1. [TF] [TH] Nội dung chung của câu Đúng/Sai:\n*A. Ý đúng thì có dấu * phía trước\nB. Ý sai\n*C. Ý đúng\nD. Ý sai",
  tln: "Câu 1. [VD] Nội dung câu hỏi (đáp án là một số)?\nTrả lời: [[12,5]]\nLời giải\nGiải thích ngắn (có thể bỏ)."
};
function qEditor(anchor, raw, isNew, save, done) {
  const host = anchor.closest(".bk-lt") ? anchor : anchor; if (host.parentElement.querySelector(":scope > .qedit[data-for='" + (anchor.dataset.key || "new") + "']")) return;
  const box = document.createElement("div"); box.className = "qedit panel"; box.dataset.for = anchor.dataset.key || "new";
  box.innerHTML = `${isNew ? `<div class="row qe-tpl"><span class="lbl">Mẫu:</span><button class="pill" data-t="tn">Trắc nghiệm</button><button class="pill" data-t="ds">Đúng/Sai 4 ý</button><button class="pill" data-t="tln">Trả lời ngắn</button></div>` : ""}
    <div class="qe-grid"><textarea class="code qe-raw" spellcheck="false" aria-label="Nội dung câu hỏi"></textarea><div class="qe-prev" aria-live="polite"></div></div>
    <div class="qe-msg note"></div>
    <div class="row"><button class="btn primary qe-save">${isNew ? "Thêm câu" : "Lưu"}</button><button class="btn qe-cancel">Hủy</button><span class="note">Mức độ: [NB] [TH] [VD] · đáp án đúng có dấu * · công thức $...$ · hình: dán ảnh (Ctrl+V)</span></div>`;
  anchor.insertAdjacentElement("afterend", box);
  const ta = box.querySelector(".qe-raw"), pv = box.querySelector(".qe-prev"), msg = box.querySelector(".qe-msg");
  const show = () => { const v = App.bank.validate(ta.value); msg.textContent = v.ok ? "" : v.msg; msg.classList.toggle("bad", !v.ok);
    if (!v.ok) { pv.innerHTML = ""; return; } const it = App.parseSet(v.raw).items[0];
    pv.innerHTML = `<div class="bk-q">${App.html(it.q)}</div>` + (it.type === "tf4" ? `<ol type="a" class="bk-opts">${it.statements.map((s, i) => `<li><b class="${it.truth[i] ? "tt" : "ff"}">${it.truth[i] ? "Đ" : "S"}</b> ${App.html(s)}</li>`).join("")}</ol>`
      : it.options ? `<ol type="A" class="bk-opts">${it.options.map((o, i) => `<li class="${i === it.correct ? "ok" : ""}">${App.html(o)}</li>`).join("")}</ol>` : it.type === "short" ? `<div class="bk-ans">→ ${App.html(it.answer)}</div>` : ""); };
  ta.value = raw; show(); ta.focus();
  ta.oninput = show; ta.onkeydown = e => e.stopPropagation();
  ta.addEventListener("paste", async e => { const f = [...(e.clipboardData?.files || [])].find(x => /^image\//.test(x.type)); if (!f) return; e.preventDefault(); const id = await App.img.put(f); if (id) { const a = ta.selectionStart; ta.value = ta.value.slice(0, a) + `![](img:${id})` + ta.value.slice(a); show(); } });
  box.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { ta.value = TPL[b.dataset.t]; show(); ta.focus(); });
  box.querySelector(".qe-cancel").onclick = () => box.remove();
  box.querySelector(".qe-save").onclick = () => { const r = save(ta.value); if (!r.ok) { msg.textContent = r.msg; msg.classList.add("bad"); return; } box.remove(); done && done(); };
}
/* Ô báo lỗi dùng chung (Kho, Vòng quay, Đố vui) */
function reportForm(anchor, key, qText, done) {
  if (anchor.parentElement.querySelector(".repform")) return;
  const f = document.createElement("div"); f.className = "repform";
  f.innerHTML = `<input type="text" placeholder="Lỗi gì? (ví dụ: đáp án B mới đúng)" aria-label="Mô tả lỗi"><button class="btn small primary">Gửi báo lỗi</button><button class="btn small">Thôi</button>`;
  anchor.insertAdjacentElement("afterend", f); const inp = f.querySelector("input"); inp.focus();
  const send = () => { App.bank.report(key, qText, inp.value); f.remove(); App.toast("Đã ghi nhận báo lỗi. Xem danh sách trong Kho câu hỏi."); done && done(); };
  f.querySelectorAll("button")[0].onclick = send; f.querySelectorAll("button")[1].onclick = () => f.remove();
  inp.onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") send(); if (e.key === "Escape") f.remove(); };
}
App.reportForm = reportForm;

function copy(text, msg) {
  const done = () => App.toast(msg);
  try { navigator.clipboard.writeText(text).then(done, () => fallback()); } catch (e) { fallback(); }
  function fallback() { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { App.toast("Không sao chép được, hãy chọn và sao chép thủ công."); } ta.remove(); }
}
App.copy = copy;

  if ($("pTry")) $("pTry").onclick = tryV;
  $("pSpeak").onchange = e => { S.prefs.speak = e.target.checked; App.save(); if (e.target.checked) App.say("Xin chào cả lớp"); };

/* ---------- Hướng dẫn nhanh (nút "?" trên mỗi trò) ----------
   Dùng chung cho mọi trò: trò nào có thuộc tính help = {steps, shortcuts, tips} thì có nút "?".
   Cùng một nội dung này được dùng lại ở trang Hướng dẫn chung và bản PDF (viết một lần, không lệch nhau). */
function helpInner(g) {
  const h = g.help;
  // (h.steps||[]) …: phòng khi một trò ở Chặng 2 khai `help` nhưng quên điền `steps` — trang Hướng dẫn
  // vẽ gộp mọi trò cùng lúc, thiếu một trò sẽ vỡ cả trang nếu không có dòng phòng hờ này.
  return `<ol class="helplist">${(h.steps || []).map(s => `<li>${App.html(s)}</li>`).join("")}</ol>
    ${h.shortcuts && h.shortcuts.length ? `<div class="kbdrow">${h.shortcuts.map(s => `<span class="kbd">${esc(s.k)}</span><span class="kbdd">${esc(s.d)}</span>`).join("")}</div>` : ""}

}
let closeHelp = null;  // đang mở thì go() gọi hàm này để đóng gọn, không để lại overlay/phím tắt mồ côi khi chuyển màn
function openHelp(g) {
  if (!g.help) return;
  if (closeHelp) closeHelp();
  const ov = document.createElement("div"); ov.className = "overlay"; ov.id = "gHelpOv";
  ov.innerHTML = `<div class="result yen helpbox" role="dialog" aria-modal="true" aria-labelledby="gHelpT">

      <h2 id="gHelpT" style="font-size:19px;margin:0">❓ Hướng dẫn nhanh · ${esc(g.name)}</h2>
      <button class="btn small" id="gHelpX">Đóng</button>
    </div>
    ${helpInner(g)}
    <span class="note">Xem đầy đủ cho mọi trò ở <a href="#" id="gHelpFull">trang Hướng dẫn</a>.</span>
  </div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); removeEventListener("keydown", onKey, true); closeHelp = null; };
  // Chặn MỌI phím lan xuống trò chơi/phím tắt chung trong lúc bảng này đang mở (không chỉ Esc) —
  // tránh Space/P/M lỡ tay khi đang đọc hướng dẫn làm trò tự chạy (vd Vòng quay tự quay) phía sau bảng.
  const onKey = e => { e.stopPropagation(); if (e.key === "Escape") { e.preventDefault(); close(); } };

  addEventListener("keydown", onKey, true);

}
function mountGame(g) {

function control(s, v) {
  const id = "set_" + s.key;
  if (s.type === "toggle") return `<label class="switch"><input type="checkbox" id="${id}" ${v ? "checked" : ""}> ${esc(s.label)}</label>${s.note ? `<span class="note">${esc(s.note)}</span>` : ""}`;
  let inner = "";
  if (s.type === "seg") inner = `<div class="seg" id="${id}">${Object.entries(s.options).map(([k, l]) => `<button data-v="${k}" aria-pressed="${String(v) === k}">${esc(l)}</button>`).join("")}</div>`;
  else if (s.type === "range") inner = `<input type="range" id="${id}" min="${s.min}" max="${s.max}" step="${s.step || 1}" value="${v}">`;
  else if (s.type === "text") inner = `<textarea id="${id}" style="min-height:90px" placeholder="${esc(s.placeholder || "")}">${esc(v)}</textarea>`;
  const lab = s.type === "range" ? `${esc(s.label)}: <span id="${id}_v">${v}</span>${s.unit ? " " + esc(s.unit) : ""}` : esc(s.label);
  return `<div class="field"><label class="label" ${s.type === "seg" ? "" : `for="${id}"`}>${lab}</label>${inner}${s.note ? `<span class="note">${esc(s.note)}</span>` : ""}</div>`;
}
function renderDrawer(g, cfg) {
  const all = g.settings || [], basic = all.filter(s => !s.advanced), adv = all.filter(s => s.advanced);
  const d = $("drawer");
  d.innerHTML = `<h3>Tùy chỉnh</h3>${basic.map(s => control(s, cfg[s.key])).join("")}
    <div class="field"><label class="label" for="set__vol">Âm lượng chung: <span id="set__vol_v">${S.prefs.volume}</span>%</label><input type="range" id="set__vol" min="0" max="100" value="${S.prefs.volume}"></div>
    <div class="field"><span class="label">Hình nền</span><div id="drawerBg"></div></div>
    ${adv.length ? `<details ${d.dataset.adv === "1" ? "open" : ""}><summary>Nâng cao</summary><div class="adv">${adv.map(s => control(s, cfg[s.key])).join("")}</div></details>` : ""}`;
  const det = d.querySelector("details"); if (det) det.ontoggle = () => d.dataset.adv = det.open ? "1" : "";
  const dbg = () => { const x = $("drawerBg"); if (!x) return; x.innerHTML = App.bgPicker(true); App.wireBgPicker(x, dbg); }; dbg();
  $("set__vol").oninput = e => { App.setVolume(e.target.value); $("set__vol_v").textContent = e.target.value; };
  $("set__vol").onchange = () => App.sound.tick("click");
  all.forEach(s => {
    const el = $("set_" + s.key);

      cfg[s.key] = v; App.save();

    else if (s.type === "range") { el.oninput = () => { $("set_" + s.key + "_v").textContent = el.value; }; el.onchange = () => apply(+el.value); }
    else if (s.type === "text") { let t; el.oninput = () => { clearTimeout(t); t = setTimeout(() => apply(el.value), 400); }; }
  });
}

/* ---------- Phím tắt ---------- */
document.addEventListener("keydown", e => {
  const a = document.activeElement, typing = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && !["range", "checkbox"].includes(a.type) || (a && a.isContentEditable);
  if (typing && e.key !== "Escape") return;
  if (view === "game" && current && current.onKey && current.onKey(e)) { e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  if (k === "escape") { if ($("app").classList.contains("present")) present(false); return; }
  if (view !== "game") return;
  if (k === "p") present(!$("app").classList.contains("present"));
  else if (k === "m") { App.setVolume(S.prefs.volume ? 0 : 70); App.toast(S.prefs.volume ? "Đã bật âm thanh" : "Đã tắt âm thanh"); const r = $("set__vol"); if (r) { r.value = S.prefs.volume; $("set__vol_v").textContent = S.prefs.volume; } }
});

  const st = App.fs.state;
  c.hidden = st === "unsupported";
  c.className = "iconbtn savechip " + ({ on: "ok", need: "warn", error: "bad", conflict: "warn" }[st] || "");
  c.textContent = st === "on" ? (App.fs.lastSaved ? `Đã lưu ${hhmm(App.fs.lastSaved).slice(0, 5)}` : "Đang lưu…") : st === "need" ? "Bấm để bật tự lưu" : st === "error" ? "Lỗi lưu" : st === "conflict" ? "Chờ chọn dữ liệu" : "Chưa lưu ra thư mục";
  c.title = st === "on" ? `Tự lưu vào ${App.fs.folder}\\DuLieu` : "";
}

/* ---------- Khởi động ---------- */
/* ---------- Bản web: cài vào máy, chạy khi mất mạng, tự cập nhật ---------- */
let installEvt = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; const b = $("btnInstall"); if (b) b.hidden = false; });
addEventListener("appinstalled", () => { installEvt = null; const b = $("btnInstall"); if (b) b.hidden = true; App.toast("Đã cài Lớp Vui vào máy. Mở từ biểu tượng trên màn hình."); });
function setupWebApp() {
  const b = $("btnInstall"); if (b) b.onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; b.hidden = true; };
  if (!("serviceWorker" in navigator) || !/^https?:/.test(location.protocol) || !App.WEB) return;
  navigator.serviceWorker.register("sw.js").then(reg => {
    const offer = w => App.toast("Có bản Lớp Vui mới.", { label: "Cập nhật", fn: () => w.postMessage("skip") });
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener("updatefound", () => { const w = reg.installing; w && w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) offer(w); }); });
    setInterval(() => reg.update().catch(() => { }), 30 * 60 * 1000);
  }).catch(e => console.warn(e));
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (reloading) return; reloading = true; App.saveNow(); location.reload(); });
}
/* Bản thử: dải màu cam trên cùng, luôn hiện, để không nhầm với bản chính khi đứng lớp */
function thuBar() {
  if (!App.THU || $("thuBar")) return;
  const d = document.createElement("div"); d.id = "thuBar"; d.className = "thubar"; d.setAttribute("role", "note");
  const luc = S.thuCopied ? new Date(S.thuCopied).toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" }) : "";
  d.innerHTML = `<b>BẢN THỬ ${esc(App.VERSION || "")}</b><span>Dữ liệu riêng${luc ? ` (bản sao từ bản chính lúc ${esc(luc)})` : ""} – sửa thoải mái, bản chính không bị ảnh hưởng.</span><button class="btn small" id="thuLayLai">Lấy lại dữ liệu từ bản chính</button>`;
  document.body.prepend(d);
  $("thuLayLai").onclick = () => { if (!App.thuLayLai()) App.toast("Trình duyệt này chưa có dữ liệu của bản chính."); };
}
App.start = () => {
  thuBar();
  setupWebApp();
  App.bank.init();
  document.documentElement.classList.toggle("lessfx", !!S.prefs.lessFx);
  renderSubjects(); App.applySubject(); App.loadVoices(); updateSubjCounts();
  $("brand").onclick = () => { present(false); go("home"); };
  $("btnGuide").onclick = () => { present(false); go("guide"); };
  $("btnSettings").onclick = () => { present(false); go("settings"); };
  $("btnLook").onclick = () => { const k = Object.keys(App.LOOKS), n = k[(k.indexOf(App.look()) + 1) % k.length]; App.setLook(n); App.toast(`Giao diện: ${App.LOOKS[n].name}`); };
  $("saveChip").onclick = () => { if (App.fs.state === "need") fsAct(App.fs.reconnect()); else { present(false); go("settings"); } };
  let lastFs = App.fs.state;
  App.fs.onChange(() => { updateChip(); renderFsPanel(); if (view === "home" && App.fs.state !== lastFs && !document.querySelector(".overlay")) home(); lastFs = App.fs.state; });
  App.fs.init().then(() => { updateChip(); if (App.fs.pendingConflict) { const d = App.fs.pendingConflict; App.fs.pendingConflict = null; showConflict(d); } if (view === "home") home(); });
  $("btnPresent").onclick = () => present(true);
  $("btnExit").onclick = () => present(false);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => current && current.redraw && current.redraw());
  new MutationObserver(() => current && current.redraw && current.redraw()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  go("home");
};
})();

App.img.init().then(App.start, App.start);
</script>
